name: Temporary W04 Finalise run selection validation
on:
  push:
    paths:
      - '.github/workflows/w04-finalise-run-ui-temporary.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Parse Shiny and verify Finalise selection
        run: |
          Rscript -e 'parse(file="multiuser_app/app.R")'
          python - <<'PY'
          from pathlib import Path
          s=Path('multiuser_app/app.R').read_text()
          start=s.index('tabPanel("Run model"')
          end=s.index('tabPanel("Model results"',start)
          assert 'uiOutput("w04_model_run_choices")' not in s[start:end]
          fin=s.index('tabPanel("Finalise"')
          assert 'uiOutput("w04_model_run_choices")' in s[fin:fin+1500]
          assert 'observeEvent(input$w04_finalise_prepare' in s
          print('PASS W04 Finalise owns run selection')
          PY
