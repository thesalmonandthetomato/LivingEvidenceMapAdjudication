name: Temporary W04 assignment button validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_w04_assignment_button_gate.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Parse and validate W04 button gates
        shell: Rscript {0}
        run: |
          invisible(parse(file="multiuser_app/app.R"))
          s <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          for (task in c("manual_screening","conflict_resolution","model_uncertainty"))
            stopifnot(grepl(paste0('w04_user_has_assignment("',task,'")'),s,fixed=TRUE))
          stopifnot(grepl('identical(z$status,"assigned")',s,fixed=TRUE))
          cat("PASS: W04 buttons require assigned cases and application parses\n")
