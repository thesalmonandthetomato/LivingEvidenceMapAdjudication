name: Temporary Validate Configure and W04 Launch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-validate-configure-w04-20261016.yml'
      - 'multiuser_app/app.R'
      - 'multiuser_app/R/w04_shiny_model_launch.R'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Parse changed R files
        shell: Rscript {0}
        run: |
          parse("multiuser_app/app.R")
          parse("multiuser_app/R/w04_shiny_model_launch.R")
          cat("PASS: changed R files parse\n")
      - name: Test W04 duplicate protection and configuration structure
        shell: Rscript {0}
        run: |
          source("multiuser_app/R/w04_shiny_model_launch.R", local=TRUE)
          label <- "W04 Shiny subset review bundle.json"
          runs <- list(
            list(display_title=label, conclusion="startup_failure", html_url="https://example.org/1"),
            list(display_title="Other", conclusion="success"))
          stopifnot(length(w04_shiny_model_blocking_runs(runs,label)) == 0L)
          for (state in c("success","failure","cancelled","skipped","")) {
            runs[[1L]]$conclusion <- state
            stopifnot(length(w04_shiny_model_blocking_runs(runs,label)) == 1L)
          }
          app <- readLines("multiuser_app/app.R", warn=FALSE)
          txt <- paste(app,collapse="\n")
          stopifnot(grepl('output\\$configure_review <- renderUI',txt))
          stopifnot(grepl('output\\$configure_review_contents <- renderUI',txt))
          stopifnot(grepl('uiOutput\\("configure_review_contents"\\)',txt))
          stopifnot(grepl('configure_review_requested\\(\\)',txt))
          for (id in c("w04_model_launch","w04_model_refresh","w04_highlight_save",
                       "w04_subset_registry_refresh","search_manual_submit"))
            stopifnot(grepl(paste0('"',id,'"'),txt,fixed=TRUE))
          cat("PASS: startup_failure retry, all other attempts blocked, configuration entry point and controls retained\n")
