name: Temporary configuration cleanup check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-config-w03-removal-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Check Shiny code
        shell: Rscript {0}
        run: |
          parse(file='multiuser_app/app.R')
          x<-paste(readLines('multiuser_app/app.R',warn=FALSE),collapse='\n')
          stopifnot(!grepl('configure-review-retractions',x,fixed=TRUE))
          cat('PASS W03 accordion removed\n')
