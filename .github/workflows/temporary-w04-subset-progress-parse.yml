name: Temporary W04 subset progress syntax check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-subset-progress-parse.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse final W04 subset UI
        shell: Rscript {0}
        run: |
          parse(file='multiuser_app/app.R')
          x <- paste(readLines('multiuser_app/app.R',warn=FALSE),collapse='\n')
          stopifnot(grepl('Verifying eligible W04 corpus',x,fixed=TRUE),
                    grepl('Saving W04 subset',x,fixed=TRUE))
          cat('PASS W04 subset progress and final app syntax\n')
