name: Temporary W04 reconciled export validation
on:
  push:
    paths:
      - '.github/workflows/w04-export-validation-temporary.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install declared test dependencies
        shell: Rscript {0}
        run: install.packages(c('digest','jsonlite'))
      - name: Parse helpers and test reconciled export
        run: |
          Rscript -e 'parse(file="multiuser_app/R/w04_model_batches.R")'
          cd multiuser_app
          Rscript tests/test_w04_reconciled_export.R
          Rscript tests/test_w04_corpus_reconciliation.R
