name: Temporary Stage 2 navigation contract
on:
  push:
    paths: ['.github/workflows/temporary-stage2-navigation-contract.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Verify session navigation and persistence contracts
        shell: Rscript {0}
        run: |
          p <- "multiuser_app/app.R"
          parse(file=p)
          x <- paste(readLines(p,warn=FALSE),collapse="\n")
          task <- regexpr("observeEvent(app_view(), {",x,fixed=TRUE)[1]
          stopifnot(task>0L)
          task_section <- substr(x,task,task+1350L)
          stopifnot(grepl('if (isTRUE(shiny::isolate(login_initialising()))) return()',task_section,fixed=TRUE))
          stopifnot(!grepl('read_sheet_assignments(',task_section,fixed=TRUE))
          login <- regexpr("observeEvent(input$login, {",x,fixed=TRUE)[1]
          stopifnot(login>0L)
          login_section <- substr(x,login,login+18000L)
          stopifnot(grepl('read_assignment_registry(assignment_path)',login_section,fixed=TRUE))
          stopifnot(grepl('active_sheet_w04_decisions',login_section,fixed=TRUE))
          stopifnot(grepl('cases_for_assignment_user(',login_section,fixed=TRUE))
          stopifnot(grepl('expected_current_signature = assignment_registry_signature(assignment_registry_rv())',x,fixed=TRUE))
          cat("PASS: login reads persisted assignment and decisions, task navigation avoids assignment refetch, saves retain optimistic concurrency guard\n")
