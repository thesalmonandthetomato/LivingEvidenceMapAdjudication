name: Temporary batch status cache validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-batch-status-cache-validation.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Check R syntax and workflow status safeguards
        shell: Rscript {0}
        run: |
          parse("multiuser_app/R/storage_sheets.R")
          parse("multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/R/storage_sheets.R",warn=FALSE),collapse="\n")
          stopifnot(grepl("invalidate_batch_status_cache()",x,fixed=TRUE))
          stopifnot(grepl("(as.numeric(Sys.time()) - cached_at) < 10",x,fixed=TRUE))
          stopifnot(grepl("googlesheets4::sheet_append(ss,data=row,sheet=tab)\n  invalidate_batch_status_cache()",x,fixed=TRUE))
          stopifnot(grepl("verify <- googlesheets4::read_sheet(ss,sheet=tab,col_types=\"c\")",x,fixed=TRUE))
          cat("PASS: batch cache read TTL, invalidation and write verification retained\n")
