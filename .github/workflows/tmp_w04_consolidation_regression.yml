name: Temporary W04 consolidation regression (recheck)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_w04_consolidation_regression.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Validate W04 location and one-read behaviour
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          parse(file="multiuser_app/R/w04_work_overview_sheets.R")
          s <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(length(gregexpr('actionButton("w04_overview_refresh"',s,fixed=TRUE)[[1]])==1L)
          stopifnot(grepl('tags$summary(tags$strong("W04 · Screening and validation"))',s,fixed=TRUE))
          stopifnot(grepl('w04_summary_read(review_id=meta$review_id,create_if_missing=FALSE)',s,fixed=TRUE))
          cat("PASS: W04 consolidated panel and source-level read contract\n")
