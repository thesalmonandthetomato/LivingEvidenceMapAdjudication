name: W04 disclosure persistence test (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate stable disclosure keys
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          src <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          for (key in c("configure-review-w04","configure-review-w04-model-screening",
                        "configure-review-w04-prompt-refinement")) {
            target <- paste0('"',key,'"')
            hits <- gregexpr(target,src,fixed=TRUE)[[1]]
            stopifnot(length(hits)==1L, hits[[1]]>0L)
          }
          stopifnot(grepl("restoreDetails(document)",src,fixed=TRUE))
          stopifnot(grepl("sessionStorage.setItem(key",src,fixed=TRUE))
          cat("PASS: nested W04 disclosures use the existing persistent-state handler.\n")
