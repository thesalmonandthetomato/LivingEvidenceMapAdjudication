name: Temporary W04 readable run selection test
on:
  push:
    paths:
      - '.github/workflows/w04-readable-runs-temporary.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c('digest','jsonlite'))
      - name: Validate app syntax and selectors
        run: |
          Rscript -e 'parse(file="multiuser_app/app.R")'
          python - <<'PY'
          from pathlib import Path
          s=Path('multiuser_app/app.R').read_text()
          assert 'Model run to retain' in s
          assert 'Show full run provenance' in s
          assert 'b$retain," include, ",b$exclude," exclude, "' in s
          assert 'selected=""' in s
          print("PASS readable model run selector")
          PY
          cd multiuser_app
          Rscript tests/test_w04_model_coverage_reconstruction.R
