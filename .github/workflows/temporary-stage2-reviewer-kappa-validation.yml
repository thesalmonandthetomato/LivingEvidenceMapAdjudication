name: Temporary Stage 2 reviewer kappa validation
on:
  push:
    paths:
      - '.github/workflows/temporary-stage2-reviewer-kappa-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Validate parser and reviewer kappa guards
        shell: Rscript {0}
        run: |
          p <- "multiuser_app/app.R"
          parse(file=p)
          src <- paste(readLines(p, warn=FALSE), collapse="\n")
          stopifnot(grepl('if (user_can(login_user,"manage_assignments"))', src, fixed=TRUE))
          stopifnot(grepl('if (session_can("manage_assignments"))', src, fixed=TRUE))
          stopifnot(grepl('manual_screening_rv(login_timed_read("manual screening metrics",read_manual_screening_metrics))', src, fixed=TRUE))
          cat("PASS: app.R parses; reviewer-only kappa skip and administrator refresh guards present\n")
