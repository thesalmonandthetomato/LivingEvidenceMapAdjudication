name: Temporary W04 Finalise read-only integration validation
on:
  push:
    paths:
      - '.github/workflows/w04-selection-wiring-temporary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Parse Shiny app and W04 helpers
        run: |
          Rscript -e 'parse(file="multiuser_app/app.R");parse(file="multiuser_app/R/w04_subset_registry.R");parse(file="multiuser_app/R/w04_model_batches.R");parse(file="multiuser_app/R/w04_shiny_model_launch.R")'
      - name: Install digest and run regression tests
        run: |
          Rscript -e 'install.packages("digest",repos="https://cloud.r-project.org")'
          cd multiuser_app
          Rscript tests/test_w04_reconstructed_selection.R
          Rscript tests/test_w04_model_coverage_reconstruction.R
          Rscript tests/test_w04_reconstructed_launcher.R
          Rscript tests/test_w04_corpus_reconciliation.R
          Rscript tests/test_w04_saved_resolution_provenance.R
