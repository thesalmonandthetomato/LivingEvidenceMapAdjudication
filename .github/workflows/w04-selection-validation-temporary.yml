name: Temporary W04 selection validation
on:
  push:
    paths:
      - '.github/workflows/w04-selection-validation-temporary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install unit-test dependencies
        run: Rscript -e 'install.packages("digest", repos="https://cloud.r-project.org")'
      - name: Parse Shiny R sources
        run: |
          Rscript -e 'files <- c("multiuser_app/app.R",list.files("multiuser_app/R", pattern="[.]R$", full.names=TRUE)); for (f in files) {parse(file=f); cat("PASS:", f, "\\n")}'
      - name: Check W04 selection logic
        working-directory: multiuser_app
        run: Rscript tests/test_w04_model_selection.R
