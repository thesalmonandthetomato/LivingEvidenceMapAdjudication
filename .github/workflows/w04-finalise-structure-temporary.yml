name: Temporary W04 Finalise handler validation
on:
  push:
    paths:
      - '.github/workflows/w04-finalise-structure-temporary.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Parse Shiny and check Finalise handler structure
        run: |
          Rscript -e 'z<-parse(file="multiuser_app/app.R"); s<-paste(deparse(z),collapse=" ");stopifnot(grepl("w04_finalise_export",s,fixed=TRUE)); cat("PASS Shiny parsed with Finalise handler\n")'
      - name: Install and run reconciliation regression suite
        run: |
          Rscript -e 'install.packages(c("digest","jsonlite"),repos="https://cloud.r-project.org")'
          cd multiuser_app
          Rscript tests/test_w04_reconciled_export.R
          Rscript tests/test_w04_corpus_reconciliation.R
          Rscript tests/test_w04_saved_resolution_provenance.R
