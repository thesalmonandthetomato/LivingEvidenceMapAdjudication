name: Temporary W04 ordered steps validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-ordered-steps-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Check step order and prerequisite gate
        shell: Rscript {0}
        run: |
          parse(file='multiuser_app/app.R')
          x<-paste(readLines('multiuser_app/app.R',warn=FALSE),collapse='\n')
          a<-regexpr('Step 1 · Verify the eligible corpus',x,fixed=TRUE)[1]
          b<-regexpr('Step 2 · Create or load a registered subset',x,fixed=TRUE)[1]
          c<-regexpr('Step 3 · Prepare a human-screening queue',x,fixed=TRUE)[1]
          stopifnot(a>0,b>a,c>b,
                    grepl('output$w04_subset_prepare_control <- renderUI',x,fixed=TRUE),
                    grepl('!is.null(w04_subset_corpus_rv())',x,fixed=TRUE),
                    grepl('uiOutput("w04_subset_prepare_control")',x,fixed=TRUE))
          stopifnot(grepl('w04_all_cases_rv(q$cases)',x,fixed=TRUE),grepl('w04_batch_id_rv(q$batch_id)',x,fixed=TRUE))
          cat('PASS ordered steps and assignment activation\n')
