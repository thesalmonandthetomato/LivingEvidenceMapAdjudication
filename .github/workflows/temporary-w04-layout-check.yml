name: Temporary W04 layout validation
on:
  push:
    paths: ['.github/workflows/temporary-w04-layout-check.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse app and check W04 layout
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(length(gregexpr('actionButton("w04_reviewer_batches_refresh"',x,fixed=TRUE)[[1]])==1L)
          stopifnot(grepl("Review completed model screening runs",x,fixed=TRUE))
          stopifnot(grepl('if(session_can("adjudicate_assigned")) div(',x,fixed=TRUE))
          stopifnot(grepl("Model uncertainty resolution",x,fixed=TRUE))
          cat("PASS W04 layout parse and single reviewer action control\n")
