name: Temporary W02 progress integration check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w02-progress-check.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse W02 Shiny progress integration
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          parse(file="multiuser_app/R/github_dispatch.R")
          parse(file="multiuser_app/R/storage_sheets.R")
          cat("PASS: W02 progress integration R syntax\n")
