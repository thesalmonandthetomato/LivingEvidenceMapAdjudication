name: Temporary W04 registered subset assignment validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-assignment-subset-test.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse app and validate registered-only assignment wiring
        shell: Rscript {0}
        run: |
          parse(file='multiuser_app/app.R')
          parse(file='multiuser_app/R/w04_subset_screening_adapter.R')
          x<-paste(readLines('multiuser_app/app.R',warn=FALSE),collapse='\n')
          stopifnot(grepl('w04_assignment_subset_id',x,fixed=TRUE),
                    grepl('w04_subset_queue_cases(chosen[[1L]],w04_all_cases_rv()',x,fixed=TRUE),
                    grepl('Select a registered human-screening subset',x,fixed=TRUE),
                    grepl('Verify the eligible corpus before assigning a subset',x,fixed=TRUE))
          cat('PASS subset-only W04 manual assignment guardrails\n')
