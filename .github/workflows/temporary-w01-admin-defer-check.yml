name: Temporary W01 admin defer validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w01-admin-defer-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Parse and verify W01 gating
        shell: Rscript {0}
        run: |
          parse("multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(length(gregexpr("observeEvent(list(authenticated(), configure_review_requested()), {",x,fixed=TRUE)[[1]])==2L)
          stopifnot(length(gregexpr("!isTRUE(configure_review_requested())",x,fixed=TRUE)[[1]]) >= 2L)
          stopifnot(grepl("w01_persisted_lock_rv <- reactiveVal(TRUE)",x,fixed=TRUE))
          stopifnot(grepl("w01_has_published_review_run(review,sheet)",x,fixed=TRUE))
          stopifnot(grepl("w01_latest_final_review_receipt(review,sheet)",x,fixed=TRUE))
          cat("PASS: W01 eligibility and receipt remain fail-closed and deferred\n")
