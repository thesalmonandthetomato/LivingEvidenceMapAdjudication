name: Temporary W04 save progress validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-save-progress-validation.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Check W04 save feedback wiring
        shell: Rscript {0}
        run: |
          parse(file='multiuser_app/app.R')
          lines <- readLines('multiuser_app/app.R',warn=FALSE)
          stopifnot(any(grepl('w04_prompt_progress',lines,fixed=TRUE)),
                    any(grepl('w04_prompt_feedback',lines,fixed=TRUE)),
                    any(grepl('Verified restricted Zenodo draft version:',lines,fixed=TRUE)))
          cat('PASS: W04 prompt save feedback syntax and wiring\n')
