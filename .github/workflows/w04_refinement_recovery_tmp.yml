name: W04 refinement recovery test (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse and exercise guard with mocked state
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          source("multiuser_app/R/w04_prompt_refinement.R", local=FALSE)
          `%||%` <- function(a,b) if(is.null(a)) b else a
          info <- list(filename="w04-refinement-request-aaaaaaaaaaaaaaaaaaaa.json",
                       response_file="w04-refinement-response-aaaaaaaaaaaaaaaaaaaa.json",
                       draft_id="123")
          meta <- list(review_id="example")
          files <- character()
          status <- list(state="failed", url="https://github.com/example/run")
          w04_refinement_run_status <- function(info) status
          w04_prompt_fetch_draft <- function(meta)
            list(id="123", files=lapply(files,function(x)list(filename=x)))
          check <- function(expected) stopifnot(identical(w04_refinement_can_retry_failed(meta, info), expected))
          check(TRUE)
          status <- list(state="running", url="https://github.com/example/run"); check(FALSE)
          status <- list(state="queued", url="https://github.com/example/run"); check(FALSE)
          status <- list(state="completed", url="https://github.com/example/run"); check(FALSE)
          status <- list(state="failed", url=""); check(FALSE)
          status <- list(state="failed", url="https://github.com/example/run")
          files <- "w04-refinement-started-aaaaaaaaaaaaaaaaaaaa.json"; check(FALSE)
          files <- "w04-refinement-response-aaaaaaaaaaaaaaaaaaaa.json"; check(FALSE)
          files <- character()
          w04_prompt_fetch_draft <- function(meta) NULL
          stopifnot(inherits(try(w04_refinement_can_retry_failed(meta,info),silent=TRUE),"try-error"))
          stopifnot(grepl("w04_refinement_can_retry_failed\\(meta,prior\\)",
            paste(readLines("multiuser_app/app.R", warn=FALSE),collapse="\n")))
          cat("PASS: retry allowed only for confirmed pre-call failure; no API calls.\n")
