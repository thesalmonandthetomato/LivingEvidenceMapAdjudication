name: W04 model run labels validation temporary
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse UI and test model-run label
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          source("multiuser_app/R/w04_prompt_refinement.R",local=FALSE)
          `%||%` <- function(x,y) if(is.null(x)) y else x
          b <- list(run_id="38969142108",subset_id="sample",
                    prompt_version_id="p2",total=100L,uncertain=23L,
                    completed_at_utc="2026-10-17T13:00:00Z")
          prompts <- list(list(version_id="p1",created_at_utc="2026-10-15T10:00:00Z"),
                          list(version_id="p2",created_at_utc="2026-10-16T10:00:00Z"))
          label <- w04_model_run_display(b,prompts=prompts)
          stopifnot(grepl("17 Oct 2026",label,fixed=TRUE),
                    grepl("Version 02",label,fixed=TRUE),
                    grepl("23 uncertain",label,fixed=TRUE),
                    grepl("run 38969142108",label,fixed=TRUE))
          b$completed_at_utc <- NULL
          label2 <- w04_model_run_display(b)
          stopifnot(grepl("Date unavailable",label2,fixed=TRUE))
          stopifnot(any(grepl("w04_model_run_display",readLines("multiuser_app/app.R"),fixed=TRUE)))
          cat("PASS model run display and unchanged ID usage. No API calls.\n")
