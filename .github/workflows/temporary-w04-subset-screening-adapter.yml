name: Temporary W04 subset screening adapter validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-subset-screening-adapter.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Verify subset mapping rejects missing and unrelated cases
        shell: Rscript {0}
        run: |
          install.packages('digest',repos='https://cloud.r-project.org')
          parse(file='multiuser_app/app.R')
          source('multiuser_app/R/w04_subset_registry.R')
          source('multiuser_app/R/w04_subset_screening_adapter.R')
          sha<-paste(rep('a',64),collapse='')
          ids<-paste0('record-',seq_len(10))
          subset<-w04_subset_create('almeria-map',ids,5,124,
               source_checkpoint_sha256=sha,created_by='test')
          cases<-lapply(ids,function(x)list(record_id=x,review_case_id=paste0('case-',x)))
          mapped<-w04_subset_queue_cases(subset,cases,sha)
          stopifnot(length(mapped)==5L,identical(vapply(mapped,function(x)x$record_id,character(1)),subset$record_ids))
          coverage<-w04_subset_queue_coverage(subset,cases,sha)
          stopifnot(isTRUE(coverage$ready),coverage$missing==0L)
          fail<-function(expr) inherits(try(force(expr),silent=TRUE),'try-error')
          stopifnot(fail(w04_subset_queue_cases(subset,cases,'wrong')))
          partial<-Filter(function(x)!identical(x$record_id,subset$record_ids[[1]]),cases)
          stopifnot(fail(w04_subset_queue_cases(subset,partial,sha)))
          stopifnot(w04_subset_queue_coverage(subset,partial,sha)$missing==1L)
          dup<-c(cases,list(cases[[1]]))
          stopifnot(fail(w04_subset_queue_cases(subset,dup,sha)))
          cat('PASS strict subset queue mapping and fail-closed safeguards\n')
