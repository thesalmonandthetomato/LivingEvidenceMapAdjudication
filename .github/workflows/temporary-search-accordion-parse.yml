name: Temporary search accordion validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-search-accordion-parse.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Check Shiny syntax and nested searching sections
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(grepl('configure-review-api-searching',x,fixed=TRUE),
                    grepl('Bibliographic database API searches',x,fixed=TRUE))
          cat("PASS: nested search accordion R syntax\n")
