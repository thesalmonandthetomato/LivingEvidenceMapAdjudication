name: Temporary Configure W01 isolation regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-configure-w01-isolation-20261016.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Parse R and verify output isolation
        shell: Rscript {0}
        run: |
          parse("multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          a <- regexpr("output$configure_review_contents <- renderUI({",x,fixed=TRUE)[1]
          b <- regexpr("observeEvent(input$configure_searching_opened,",x,fixed=TRUE)[1]
          stopifnot(a>0,b>a)
          main <- substr(x,a,b-1)
          stopifnot(grepl('uiOutput("configure_w01_launch_state")',main,fixed=TRUE))
          stopifnot(grepl('uiOutput("configure_formal_start_control")',main,fixed=TRUE))
          stopifnot(!grepl("w01_launch_configuration()",main,fixed=TRUE))
          stopifnot(!grepl("w01_persisted_lock_rv()",main,fixed=TRUE))
          stopifnot(!grepl("search_formal_launched_rv()",main,fixed=TRUE))
          stopifnot(grepl("output$configure_w01_launch_state <- renderUI",x,fixed=TRUE))
          stopifnot(grepl("output$configure_formal_start_control <- renderUI",x,fixed=TRUE))
          for (id in c("w01_begin_deduplication","search_formal_start","w04_model_launch","w04_prompt_text","w04_highlight_include","w04_subset_size"))
            stopifnot(grepl(paste0('"',id,'"'),x,fixed=TRUE))
          cat("PASS: R syntax, launch controls retained, main Configure renderer isolated\n")
