name: Temporary W04 comparison access regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_w04_comparison_access.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Parse application and verify W04 comparison access
        shell: Rscript {0}
        run: |
          invisible(parse(file="multiuser_app/app.R"))
          s <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(grepl('data-accordion-key`="w04-summary-overview"',s,fixed=TRUE))
          stopifnot(grepl('w04_results_panel <- if (session_can("manage_assignments"))',s,fixed=TRUE))
          for(k in c("w04_consistency_find_models","w04_consistency_load_model","w04_save_consistency_analysis"))
            stopifnot(grepl(k,s,fixed=TRUE))
          cat("PASS: collapsible W04 overview and administrator comparison access\n")
