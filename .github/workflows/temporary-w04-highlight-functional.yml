name: Temporary W04 highlight functional test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-highlight-functional.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Test exact W04 matching
        shell: Rscript {0}
        run: |
          install.packages('htmltools',repos='https://cloud.r-project.org',quiet=TRUE)
          src <- readLines('multiuser_app/app.R',warn=FALSE)
          start <- grep('^highlight_plural_variants <- function',src)
          end <- grep('^highlight_named_terms <- function',src)
          eval(parse(text=paste(src[start:(end-1L)],collapse='\n')))
          library(htmltools)
          tags <- htmltools::tags
          tagList <- htmltools::tagList
          normalise_display_text <- function(x) trimws(gsub('[[:space:]]+',' ',as.character(x)))
          sentence <- 'the yield of vegetable crops; two solar power plants at Almeria in Southern Spain'
          conf <- 'Almería, Almeria, crop, crops, vegetable, farm'
          entries <- trimws(unlist(strsplit(conf,'[,\\r\\n]')))
          cat('ENTRIES:',paste(sprintf('[%s]',entries),collapse=' '),'\n')
          variants <- unique(unlist(lapply(entries,highlight_plural_variants),use.names=FALSE))
          cat('VARIANTS:',paste(sprintf('[%s]',variants),collapse=' '),'\n')
          for(term in c('vegetable','crop','crops','Almeria')) {
            loc <- gregexpr(tolower(term),tolower(sentence),fixed=TRUE)[[1L]]
            cat('POS',term, paste(loc,collapse=','),'\n')
          }
          x <- highlight_screening_text(sentence,conf,'Mexico')
          html <- as.character(htmltools::renderTags(x)$html)
          cat('RENDERED:',html,'\n')
          stopifnot(grepl('class="screen-include"[^>]*>vegetable</span>',html),
                    grepl('class="screen-include"[^>]*>crops</span>',html),
                    grepl('class="screen-include"[^>]*>Almeria</span>',html))
          cat('PASS all 3 expected highlights\n')
