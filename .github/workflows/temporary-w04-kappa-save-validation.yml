name: Temporary W04 subset kappa save validation
on:
  push:
    paths: ['.github/workflows/temporary-w04-kappa-save-validation.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse R and validate numbered save flow
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          a <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          for(term in c("Step 1. Select and load","Step 2. Find and select","Step 3. Compare","subset_model_validation","w04-model-run-","Saved subset %s, model run %s","No records have complete human"))
            stopifnot(grepl(term,a,fixed=TRUE))
          stopifnot(!grepl("Subset inspection is read-only. Save analyses only",a,fixed=TRUE))
          cat("PASS W04 numbered and run-bound model kappa save structure\n")
