name: Temporary W04 model queue auto-restore validation
on:
  push:
    paths: ['.github/workflows/temporary-w04-auto-restore.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse app and verify restoration identity safeguards
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          for(term in c("restore_w04_model_uncertainty_on_login <- function(user_id)",
            "w04_model_batch_registry_read(meta$review_id)",
            "read_sheet_w04_resolution_queue(as.character(b$resolution_tab))",
            "Restored model queue identity/count mismatch",
            "length(w04_resolution_all_cases_rv() %||% list())",
            "w04_resolution_origin_rv(\"shiny_model\")",
            "later::later(function()",
            "shiny::isolate(restore_w04_model_uncertainty_on_login(user_id))"))
            stopifnot(grepl(term,x,fixed=TRUE))
          cat("PASS W04 auto-restoration code parse and provenance guards\n")
