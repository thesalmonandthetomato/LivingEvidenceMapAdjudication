name: Temporary metadata cache regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-metadata-cache-regression.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Validate metadata cache and decision isolation
        shell: Rscript {0}
        run: |
          parse("multiuser_app/app.R")
          parse("multiuser_app/R/storage_sheets.R")
          x <- paste(readLines("multiuser_app/R/storage_sheets.R",warn=FALSE),collapse="\n")
          stopifnot(grepl("(now - cached_at) < 60) return(cached)",x,fixed=TRUE))
          stopifnot(grepl("read_review_metadata_cached <- function(ss)",x,fixed=TRUE))
          stopifnot(grepl("invalidate_batch_status_cache <- function()",x,fixed=TRUE))
          stopifnot(!grepl(".lem_gs4_cache$decisions",x,fixed=TRUE))
          stopifnot(!grepl(".lem_gs4_cache$assignments",x,fixed=TRUE))
          cat("PASS: metadata coalescing with uncached decision and assignment access\n")
