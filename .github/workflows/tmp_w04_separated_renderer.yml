name: Temporary W04 comparison renderer validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_w04_separated_renderer.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {r-version: '4.4.3', use-public-rspm: true}
      - name: Parse and verify comparison renderer separation
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          invisible(parse("multiuser_app/R/storage_sheets.R"))
          invisible(parse("multiuser_app/R/w04_work_overview_sheets.R"))
          s <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(grepl('w04_consistency_panel <- reactive',s,fixed=TRUE))
          stopifnot(grepl('panel <- w04_consistency_panel()',s,fixed=TRUE))
          stopifnot(grepl('output$w04_consistency_model_selector <- renderUI',s,fixed=TRUE))
          stopifnot(grepl('tabsetPanel(id="w04_workspace_tab"',s,fixed=TRUE))
          cat("PASS: W04 separated renderer and tabbed configuration parse\n")
