name: Temporary W04 combined manifest validation
on:
  push:
    paths:
      - '.github/workflows/w04-manifest-validation-temporary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages("digest",repos="https://cloud.r-project.org")'
      - name: Parse Shiny and modules
        run: |
          Rscript -e 'for(f in c("multiuser_app/app.R",list.files("multiuser_app/R",pattern="[.]R$",full.names=TRUE))) parse(file=f)'
      - name: Validate record selection
        working-directory: multiuser_app
        run: Rscript tests/test_w04_model_selection.R
      - name: Validate batch planning
        working-directory: multiuser_app
        run: Rscript tests/test_w04_combined_execution.R
      - name: Check manifest archive is explicitly non-dispatching
        run: |
          grep -q 'w04_combined_manifest_archive' multiuser_app/R/w04_combined_execution.R
          grep -q 'w04_combined_manifest_prepare' multiuser_app/app.R
