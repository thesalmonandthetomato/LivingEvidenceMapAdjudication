name: Temporary login performance syntax validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-login-performance-validation.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate app syntax and login instrumentation
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(grepl('LEM login load',x,fixed=TRUE))
          stopifnot(grepl('w04_conflict_decision_log <- NULL',x,fixed=TRUE))
          cat("PASS Shiny syntax and W04 login read reuse\n")
