name: Temporary W04 overlapping vote coverage regression
on:
  push:
    paths:
      - '.github/workflows/w04-overlap-temporary.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install minimal test dependencies
        shell: Rscript {0}
        run: install.packages(c('digest','jsonlite'))
      - name: Verify W04 overlap, reconciliation and Shiny syntax
        run: |
          Rscript -e 'parse(file="multiuser_app/app.R");parse(file="multiuser_app/R/w04_model_batches.R")'
          cd multiuser_app
          Rscript tests/test_w04_model_coverage_reconstruction.R
          Rscript tests/test_w04_reconstructed_selection.R
          Rscript tests/test_w04_corpus_reconciliation.R
