name: Temporary restore W04 dashboard cards
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_restore_w04_cards.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Parse and check dashboard cards
        shell: Rscript {0}
        run: |
          invisible(parse(file="multiuser_app/app.R"))
          s <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          for (label in c('"Manual screening"','"Reviewer conflict resolution"','"Model uncertainty resolution"','"Annotation"'))
            stopifnot(grepl(label,s,fixed=TRUE))
          stopifnot(!grepl('if(!isTRUE(w04_queue_loaded_rv())) {\n            div(class="col-12"',s,fixed=TRUE))
          for (key in c("w04_open_manual_on_demand","w04_open_conflicts_on_demand","w04_open_uncertainties_on_demand"))
            stopifnot(grepl(key,s,fixed=TRUE))
          cat("PASS: W04 cards restored with lazy data and separate admin accordion\n")
