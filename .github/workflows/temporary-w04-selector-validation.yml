name: Temporary W04 subset selector validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-selector-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate new first-subset selector and seed handling
        shell: Rscript {0}
        run: |
          parse(file='multiuser_app/app.R')
          x <- paste(readLines('multiuser_app/app.R',warn=FALSE),collapse='\\n')
          stopifnot(grepl('choices <- c("Full eligible corpus"="full")',x,fixed=TRUE))
          stopifnot(grepl('if(length(subsets)) choices <- c(choices,"Unsampled remainder"="remainder")',x,fixed=TRUE))
          stopifnot(grepl('seed=sample.int(.Machine$integer.max,1L)',x,fixed=TRUE))
          stopifnot(!grepl('numericInput("w04_subset_seed"',x,fixed=TRUE))
          stopifnot(grepl('The first subset must be sampled from the full eligible corpus',x,fixed=TRUE))
          cat('PASS subset selector and automatic stored random seed\\n')
