name: Temporary Stage 3 assignment conflict validation
on:
  push:
    paths: ['.github/workflows/temporary-stage3-assignment-conflicts.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Test optimistic concurrency with simulated sessions
        shell: Rscript {0}
        run: |
          lines <- readLines("multiuser_app/R/storage_sheets.R",warn=FALSE)
          start <- grep("^write_sheet_assignments <- function\\(",lines)
          end <- grep("^write_test_queue_tab <- function\\(",lines)
          stopifnot(length(start)==1L,length(end)==1L,end>start)
          fn <- parse(text=paste(lines[start:(end-1L)],collapse="\n"))[[1L]]
          env <- new.env(parent=baseenv())
          env$'%||%' <- function(x,y) if(is.null(x)) y else x
          env$normalise_assignment_row <- identity
          env$validate_assignment_registry <- function(x) invisible(TRUE)
          env$gs4_auth_from_env <- function() invisible(NULL)
          env$ensure_sheet_assignment_registry <- function() invisible(NULL)
          env$sheet_id_from_env <- function() "synthetic"
          env$assignment_registry_tab <- function() "assignments"
          reads <- 0L
          writes <- 0L
          persisted <- list(list(assignment_id="initial"))
          signature <- function(x) paste(vapply(x,function(z)z$assignment_id,character(1)),collapse="|")
          env$assignment_registry_signature <- signature
          env$assignment_changes <- function(a,b) list(list(change="synthetic"))
          env$read_sheet_assignments <- function(create_if_missing=FALSE) {
            reads <<- reads+1L
            if(reads==2L && isTRUE(change_between_reads))
              persisted <<- list(list(assignment_id="other-writer"))
            persisted
          }
          env$ADJUDICATION_SCHEMA <- list(assignments=c("assignment_id"))
          eval(fn,envir=env)
          original <- signature(persisted)
          stale <- tryCatch(env$write_sheet_assignments(list(list(assignment_id="a")),
                          expected_current_signature="stale"),error=identity)
          stopifnot(inherits(stale,"error"),grepl("changed since",conditionMessage(stale)),
                    reads==1L,identical(signature(persisted),original))
          reads <- 0L
          change_between_reads <- TRUE
          conflict <- tryCatch(env$write_sheet_assignments(list(list(assignment_id="a")),
                             expected_current_signature=original),error=identity)
          stopifnot(inherits(conflict,"error"),grepl("changed during",conditionMessage(conflict)),
                    reads==2L,identical(signature(persisted),"other-writer"))
          cat("PASS: stale session and intervening update rejected before write\n")
