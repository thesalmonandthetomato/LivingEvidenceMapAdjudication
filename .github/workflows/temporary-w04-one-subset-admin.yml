name: Temporary W04 single-subset administration check
on:
  push:
    paths: ['.github/workflows/temporary-w04-one-subset-admin.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate W04 administration selector
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          for(term in c('selectInput("w04_admin_manual_subset"','workflow_sections[visible_group_indices]','chosen_manual','workflow_sections_display <- c(workflow_sections_display,list(w04_results_panel))'))
            stopifnot(grepl(term,x,fixed=TRUE))
          cat("PASS W04 administration single-subset layout\n")
