name: Temporary W04 model registry count validation
on:
  push:
    paths: ['.github/workflows/temporary-w04-registry-count-validation.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Verify model result registry counts and rejected mismatch
        shell: Rscript {0}
        run: |
          expr <- parse(file="multiuser_app/R/w04_model_batches.R")
          target <- Filter(function(z)is.call(z) && identical(as.character(z[[1L]]),"<-") && identical(as.character(z[[2L]]),"w04_model_batch_results_read"),as.list(expr))
          stopifnot(length(target)==1L)
          eval(target[[1L]],envir=.GlobalEnv)
          w04_prompt_review_metadata <- function() list(sheet_id="fake")
          mock <- data.frame(run_id=c("123","123"),subset_id=c("s","s"),record_id=c("r1","r2"),decision=c("retain","uncertain"),prompt_sha256=c("sha","sha"),result_json=c("{}","{}"))
          env <- new.env(parent=emptyenv())
          env$read_sheet <- function(...) mock
          assign("googlesheets4",env,envir=.GlobalEnv)
          batch <- list(run_id="123",subset_id="s",result_tab="w04_model_results_123",prompt_sha256="sha",total="2",retain="1",exclude="0",uncertain="1")
          stopifnot(nrow(w04_model_batch_results_read(batch))==2L)
          bad <- batch;bad$uncertain <- "0"
          err <- tryCatch(w04_model_batch_results_read(bad),error=function(e)e)
          stopifnot(inherits(err,"error"),grepl("counts differ",conditionMessage(err)))
          cat("PASS W04 model registry count check\n")
