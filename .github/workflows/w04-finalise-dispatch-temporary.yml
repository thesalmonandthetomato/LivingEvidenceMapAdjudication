name: Temporary W04 Finalise dispatch contract validation
on:
  push:
    paths:
      - '.github/workflows/w04-finalise-dispatch-temporary.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        shell: Rscript {0}
        run: install.packages(c('digest','jsonlite'))
      - name: Validate Finalise integration and existing regressions
        run: |
          Rscript -e 'parse(file="multiuser_app/app.R");parse(file="multiuser_app/R/w04_shiny_model_launch.R")'
          cd multiuser_app
          Rscript tests/test_w04_finalise_archive_bundle.R
          Rscript tests/test_w04_reconciled_export.R
          Rscript tests/test_w04_corpus_reconciliation.R
