name: Temporary W02 login read check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w02-login-read-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Validate R syntax and snapshot reuse
        shell: Rscript {0}
        run: |
          parse("multiuser_app/app.R")
          z <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(grepl("repair_decisions <- read_w02_login_decisions()",z,fixed=TRUE))
          stopifnot(grepl("w02_all_decisions <- read_w02_login_decisions()",z,fixed=TRUE))
          stopifnot(grepl('login_timed_read(\n              "W02 decisions", active_sheet_w02_decisions)',z,fixed=TRUE))
          stopifnot(grepl('mark_review_complete("02"',z,fixed=TRUE))
          cat("PASS: W02 decision snapshot and lifecycle code retained\n")
