name: Temporary W04 metadata snapshot validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w04-metadata-snapshot-check.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Parse and verify cache and write consistency
        shell: Rscript {0}
        run: |
          for(p in c("multiuser_app/app.R","multiuser_app/R/storage_sheets.R","multiuser_app/R/w04_prompt_zenodo.R")) parse(p)
          storage <- paste(readLines("multiuser_app/R/storage_sheets.R",warn=FALSE),collapse="\n")
          prompt <- paste(readLines("multiuser_app/R/w04_prompt_zenodo.R",warn=FALSE),collapse="\n")
          stopifnot(grepl("read_review_metadata_cached <- function(ss, force=FALSE)",storage,fixed=TRUE))
          stopifnot(grepl("!isTRUE(force)",storage,fixed=TRUE))
          stopifnot(grepl("read_review_metadata_cached(ss,force=force)",prompt,fixed=TRUE))
          stopifnot(grepl("fresh <- w04_prompt_review_metadata(force=TRUE)",prompt,fixed=TRUE))
          stopifnot(grepl("verified <- w04_prompt_review_metadata(force=TRUE)",prompt,fixed=TRUE))
          stopifnot(!grepl('googlesheets4::read_sheet(ss,sheet="review_metadata"',prompt,fixed=TRUE))
          cat("PASS: W04 lookups use metadata snapshot; draft creation and verification force fresh reads\n")
