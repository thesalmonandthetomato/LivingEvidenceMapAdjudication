name: Temporary W04 model coverage regression
on:
  push:
    paths:
      - '.github/workflows/w04-model-coverage-temporary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("digest",repos="https://cloud.r-project.org")'
      - working-directory: multiuser_app
        run: Rscript tests/test_w04_model_coverage_reconstruction.R
