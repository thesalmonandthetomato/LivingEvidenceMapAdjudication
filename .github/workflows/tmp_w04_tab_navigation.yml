name: Temporary W04 tabbed navigation validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_w04_tab_navigation.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {r-version: '4.4.3', use-public-rspm: true}
      - name: Parse and check workflow navigation
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          invisible(parse("multiuser_app/R/storage_sheets.R"))
          invisible(parse("multiuser_app/R/w04_work_overview_sheets.R"))
          s <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          for(label in c("Overview","Subsets","Prompts & models","Assignments","Comparisons"))
            stopifnot(grepl(paste0('tabPanel("',label,'"'),s,fixed=TRUE))
          stopifnot(grepl('id="w04_workspace_tab"',s,fixed=TRUE))
          stopifnot(grepl('w04_summary_reconcile_comparisons',s,fixed=TRUE))
          cat("PASS: W04 tabs, auto comparison and summary reconciliation parse\n")
