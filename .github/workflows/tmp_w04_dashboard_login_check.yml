name: Temporary W04 dashboard login check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_w04_dashboard_login_check.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Parse and inspect login routing
        shell: Rscript {0}
        run: |
          p <- "multiuser_app/app.R"
          parse(file=p)
          src <- paste(readLines(p,warn=FALSE),collapse="\n")
          stopifnot(grepl('session$onFlushed(load_workflow_queues,once=TRUE)',src,fixed=TRUE))
          stopifnot(!grepl('app_view("w04_workspace")\n      } else {\n        session$onFlushed(load_workflow_queues',src,fixed=TRUE))
          stopifnot(grepl('observeEvent(input$w04_overview_refresh',src,fixed=TRUE))
          cat("PASS: dashboard login routing and W04 overview on-demand refresh retained\n")
