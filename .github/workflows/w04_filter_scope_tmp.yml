name: W04 shared filter regression temporary
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Verify source-scoped W04 decision filter
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          source("multiuser_app/R/w04_model_conflicts.R",local=FALSE)
          `%||%` <- function(x,y)if(is.null(x))y else x
          stopifnot(exists("w04_filter_batch_decisions",mode="function"))
          decisions <- list(list(queue_sha256="alpha",review_case_id="one"),
            list(queue_sha256="beta",review_case_id="two"),
            list(queue_sha256="alpha",review_case_id="three"))
          matching <- w04_filter_batch_decisions(decisions,"alpha")
          stopifnot(length(matching)==2L,
            identical(vapply(matching,function(x)x$review_case_id,character(1)),
              c("one","three")),
            length(w04_filter_batch_decisions(decisions,"other"))==0L,
            length(w04_filter_batch_decisions(list(),"alpha"))==0L)
          stopifnot("w04_filter_batch_decisions" %in%
            all.names(body(w04_model_conflict_reconstruct),functions=TRUE,unique=TRUE))
          cat("PASS source-scoped helper accessible to archived conflict reconstruction; no services called.\n")
