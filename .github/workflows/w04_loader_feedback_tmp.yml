name: W04 model conflict loader feedback temporary
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Check standalone loader feedback and R syntax
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          needed <- c("w04_model_conflict_load_status_rv <- reactiveVal",
                      "output$w04_model_conflict_load_status <- renderText",
                      "textOutput(\"w04_model_conflict_load_status\"",
                      "Loading model conflicts failed:",
                      "Use the W04 Reviewer conflict resolution assignment controls")
          for(s in needed)stopifnot(grepl(s,x,fixed=TRUE))
          stopifnot(sum(grepl('textOutput("w04_model_conflict_load_status"',readLines("multiuser_app/app.R"),fixed=TRUE))==1L)
          cat("PASS: loader status is always alongside load control. No API calls.\n")
