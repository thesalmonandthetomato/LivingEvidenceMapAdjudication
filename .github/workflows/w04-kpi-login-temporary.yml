name: Temporary W04 login KPI regression
on:
  push:
    paths:
      - '.github/workflows/w04-kpi-login-temporary.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Validate Shiny parsing and KPI dependency
        run: |
          Rscript -e 'parse(file="multiuser_app/app.R")'
          python - <<'PY'
          from pathlib import Path
          s=Path('multiuser_app/app.R').read_text()
          assert 'W04 screening KPI unavailable:' in s
          assert 'w04_model_batches_rv(result)' in s
          assert 'w04_model_batch_registry_read(meta$review_id)' in s
          assert 'Latest model batch' in s
          print('PASS login W04 registry read and KPI binding')
          PY
