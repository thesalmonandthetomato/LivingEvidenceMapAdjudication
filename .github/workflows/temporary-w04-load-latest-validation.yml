name: Temporary W04 load latest validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-load-latest-validation.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate prompt restore handler
        shell: Rscript {0}
        run: |
          parse(file='multiuser_app/app.R')
          x <- paste(readLines('multiuser_app/app.R',warn=FALSE),collapse='\n')
          stopifnot(grepl('Load latest prompt',x,fixed=TRUE),
                    grepl('updateTextAreaInput(session,"w04_prompt_text",value=latest$content)',x,fixed=TRUE),
                    grepl('order(timestamps,decreasing=TRUE)',x,fixed=TRUE))
          cat('PASS latest prompt editor restore wiring\n')
