name: Temporary W04 manual KPI parse check
on:
  push:
    paths:
      - '.github/workflows/w04-manual-kpi-temporary.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Parse W04 Shiny and kappa support
        run: |
          Rscript -e 'parse(file="multiuser_app/app.R");parse(file="multiuser_app/R/w04_kappa_registry.R")'
