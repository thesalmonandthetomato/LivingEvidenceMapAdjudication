name: Temporary W02 zero-case Shiny syntax
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w02-zero-case-shiny-check.yml'
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse Shiny integration
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          parse(file="multiuser_app/R/storage_sheets.R")
          parse(file="multiuser_app/R/github_dispatch.R")
          cat("PASS: all Shiny optional W02 scripts parse\n")
