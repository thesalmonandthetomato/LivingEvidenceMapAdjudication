name: Validate multiuser Shiny baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-multiuser-app-baseline.yml'
      - 'multiuser_app/app.R'
      - 'multiuser_app/R/**'
      - 'multiuser_app/tests/**'

permissions:
  contents: read

jobs:
  offline-r-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out adjudication main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Parse all multiuser application R files
        shell: Rscript {0}
        run: |
          paths <- c("multiuser_app/app.R",
            list.files("multiuser_app/R", pattern="\\.R$", full.names=TRUE, recursive=TRUE))
          stopifnot(length(paths) > 2L, file.exists("multiuser_app/app.R"))
          for (path in paths) {
            tryCatch(parse(file=path, keep.source=FALSE),
              error=function(e) stop(sprintf("R parse failed: %s: %s",path, conditionMessage(e))))
            cat("PASS parse:", path, "\\n")
          }
          cat(sprintf("PASS: parsed %d application files\\n",length(paths)))
      - name: Install draft test dependencies
        shell: Rscript {0}
        run: |
          needed <- c("digest","jsonlite")
          missing <- needed[!vapply(needed,requireNamespace,logical(1),quietly=TRUE)]
          if(length(missing)) install.packages(missing)
      - name: Test canonical W00 source group selection offline
        working-directory: multiuser_app
        shell: bash
        run: Rscript tests/test_search_source_selection.R
      - name: Test one administrator per review
        working-directory: multiuser_app
        shell: bash
        run: Rscript tests/test_search_review_administrator.R
      - name: Test immutable strategy registry offline
        working-directory: multiuser_app
        shell: bash
        run: Rscript tests/test_search_strategy_versions.R
      - name: Test search draft persistence offline
        working-directory: multiuser_app
        shell: bash
        run: Rscript tests/test_search_draft_storage.R
      - name: Test Searching Boolean grammar offline
        working-directory: multiuser_app
        shell: bash
        run: Rscript tests/test_search_boolean_validation.R
      - name: Validate deployment target is explicitly main
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'LEM_GITHUB_SCOPING_REF=main' multiuser_app/R/github_dispatch.R
          grep -Fq 'workflow01-final-architecture' /dev/null && exit 1 || true
          echo 'PASS: Shiny scoping target guard present; no dispatch executed'
