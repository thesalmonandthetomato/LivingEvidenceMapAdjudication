name: Temporary Stage 2 admin audit validation
on:
  push:
    paths:
      - '.github/workflows/temporary-stage2-admin-audit-validation.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Validate R parsing and failed-read protection
        shell: Rscript {0}
        run: |
          p <- "multiuser_app/app.R"
          parse(file=p)
          x <- paste(readLines(p,warn=FALSE),collapse="\n")
          start <- regexpr("observeEvent(input$w04_consistency_opened, {",x,fixed=TRUE)[1]
          stopifnot(start>0L)
          section <- substr(x,start,start+5000L)
          stopifnot(grepl('all_conf <- tryCatch(active_sheet_w04_conflict_decisions(),error=function(e)e)',section,fixed=TRUE))
          stopifnot(grepl('if (inherits(all_conf,"error"))',section,fixed=TRUE))
          stopifnot(grepl('w04_consistency_status(paste("Could not load W04 conflict decisions:"',section,fixed=TRUE))
          stopifnot(!grepl('all_conf <- tryCatch(active_sheet_w04_conflict_decisions(),error=function(e)list())',section,fixed=TRUE))
          cat("PASS: administrative conflict refresh retains state on read failures\n")
