name: Temporary W04 review-bound subset creation validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-subset-create-final.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse app and source modules, test deterministic pool behavior
        shell: Rscript {0}
        run: |
          install.packages(c('digest','jsonlite'),repos='https://cloud.r-project.org')
          paths<-c('multiuser_app/app.R','multiuser_app/R/w04_subset_registry.R',
                   'multiuser_app/R/w04_subset_storage.R','multiuser_app/R/w04_subset_eligible.R',
                   'multiuser_app/R/w04_subset_review_source.R')
          for(p in paths) {parse(file=p);cat('PASS syntax ',p,'\n')}
          source('multiuser_app/R/w04_subset_registry.R')
          ids<-paste0('record-',seq_len(30))
          sha<-paste(rep('a',64),collapse='')
          a<-w04_subset_create('almeria-map',ids,10,5,
                               source_checkpoint_sha256=sha,created_by='tester')
          r<-w04_subset_pool_remainder(ids,list(a))
          b<-w04_subset_create('almeria-map',r,10,9,
                               source_checkpoint_sha256=sha,created_by='tester',existing=list(a))
          stopifnot(w04_subset_verify(a),w04_subset_verify(b),
                    !any(b$record_ids %in% a$record_ids))
          cat('PASS deterministic non-overlapping subset creation\n')
