name: Temporary W04 uncertainty discovery validation
on:
  push:
    paths: ['.github/workflows/temporary-w04-discovery-feedback.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate Shiny handler syntax and outcomes
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          for(term in c("No completed W04 model runs have been published","none has uncertain records to adjudicate","none is assigned to your account","model uncertainty batch(es) available to load","does not have permission to review model uncertainties"))
            stopifnot(grepl(term,x,fixed=TRUE))
          cat("PASS W04 model uncertainty discovery feedback and R parsing\n")
