name: Temporary W04 comparison save check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_w04_save_check.yml']
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {r-version: '4.4.3', use-public-rspm: true}
      - name: Parse modified application code
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          invisible(parse("multiuser_app/R/storage_sheets.R"))
          cat("PASS: parsed W04 authoritative save and overview status\n")
