name: Temporary W04 single-sheet registry validation
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Test W04 materialised summary without service calls
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          for(path in c("multiuser_app/R/storage_sheets.R",
             "multiuser_app/R/w04_subset_storage.R",
             "multiuser_app/R/w04_prompt_zenodo.R",
             "multiuser_app/R/w04_workspace_overview.R",
             "multiuser_app/R/w04_work_overview_sheets.R"))
            invisible(parse(path))
          app <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\\n")
          stopifnot(grepl("w04_queued_init_rv",app,fixed=TRUE),
             grepl("session$onFlushed(load_workflow_queues",app,fixed=TRUE),
             grepl("w04_summary_read(create_if_missing=FALSE)",app,fixed=TRUE))
          if(!requireNamespace("jsonlite",quietly=TRUE))install.packages("jsonlite",quiet=TRUE)
          if(!requireNamespace("digest",quietly=TRUE))install.packages("digest",quiet=TRUE)
          `%||%` <- function(a,b)if(is.null(a))b else a
          source("multiuser_app/R/w04_workspace_overview.R")
          source("multiuser_app/R/w04_work_overview_sheets.R")
          event <- function(type,id,at,payload)
            list(event_id=paste(type,id,at),review_id="r",record_type=type,
              entity_id=id,event_at_utc=at,
              details_json=as.character(jsonlite::toJSON(payload,auto_unbox=TRUE)))
          x <- list(
            event("subset","s1","2026-10-16T10:00:00Z",
              list(label="Check 1",records="100")),
            event("subset","s1","2026-10-17T10:00:00Z",
              list(label="Check 1 renamed",records="100")),
            event("prompt","p1","2026-10-15T10:00:00Z",
              list(label="Prompt revision",author="Matthew")),
            event("model_run","123","2026-10-17T12:00:00Z",
              list(subset_id="s1",prompt_version_id="p1",total="100",uncertain="3")),
            event("model_run","124","2026-10-18T12:00:00Z",
              list(subset_id="s1",prompt_version_id="p1",total="100",uncertain="0")),
            event("comparison","c1","2026-10-18T13:00:00Z",
              list(comparison_type="Human–model",source_run="124",
                raters="Matthew vs Model",conflicts="12",agreement="0.88")))
          z <- w04_summary_tables(x)
          stopifnot(nrow(z$subsets)==1L,
            identical(z$subsets$Subset[[1]],"Check 1 renamed"),
            identical(z$subsets$Models[[1]],2L),
            identical(z$prompts$Models[[1]],2L),
            identical(z$runs$Run[[1]],"124"),
            identical(z$runs$Prompt[[1]],"Prompt revision"),
            identical(z$comparisons$Conflicts[[1]],"12"),
            nrow(z$conflicts)==0L)
          stopifnot(all(c("subsets","prompts","runs","comparisons","conflicts")%in%names(z)))
          # Historical reconstruction remains an explicit action and app parsing works.
          body_text <- paste(deparse(body(w04_summary_backfill)),collapse="\\n")
          stopifnot(grepl("event_id",body_text,fixed=TRUE),
            grepl("sheet_append",body_text,fixed=TRUE))
          cat("PASS R parsing, latest-by-entity, sorted summary and backfill references.\n")
