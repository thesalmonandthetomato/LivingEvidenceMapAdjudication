name: Temporary W04 model selector validation
on:
  push:
    paths:
      - '.github/workflows/w04-model-selector-check-temporary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages("digest", repos="https://cloud.r-project.org")'
      - name: Parse Shiny code
        run: |
          Rscript -e 'files <- c("multiuser_app/app.R",list.files("multiuser_app/R",pattern="[.]R$",full.names=TRUE)); for (f in files) {parse(file=f);cat("PASS",f,"\\n")}'
      - name: W04 model record-selection regression
        working-directory: multiuser_app
        run: Rscript tests/test_w04_model_selection.R
      - name: Assert W04 scope UI and safe launch gate
        run: |
          Rscript -e 'x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n");stopifnot(grepl("w04_model_selection_verify",x,fixed=TRUE),grepl("w04_model_scope",x,fixed=TRUE),grepl("Only the existing validated subset screening path can launch",x,fixed=TRUE))'
