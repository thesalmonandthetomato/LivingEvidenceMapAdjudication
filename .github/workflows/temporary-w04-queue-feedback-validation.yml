name: Temporary W04 queue feedback validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-queue-feedback-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse W04 queue handler and guard completion
        shell: Rscript {0}
        run: |
          parse(file='multiuser_app/app.R')
          x <- paste(readLines('multiuser_app/app.R',warn=FALSE),collapse='\\n')
          stopifnot(grepl('list(queue=existing,created=FALSE)',x,fixed=TRUE),
                    !grepl('return(list(queue=existing,created=FALSE))',x,fixed=TRUE),
                    grepl('showNotification(msg,type="error",duration=NULL)',x,fixed=TRUE),
                    grepl('showNotification(msg,type="message",duration=12)',x,fixed=TRUE))
          cat('PASS W04 feedback handler syntax and existing queue status\\n')
