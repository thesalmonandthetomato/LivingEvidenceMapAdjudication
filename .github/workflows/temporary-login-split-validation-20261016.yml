name: Temporary validate login split
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-login-split-validation-20261016.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Parse and test login boundaries
        shell: Rscript {0}
        run: |
          expr <- parse("multiuser_app/app.R")
          stopifnot(length(expr)>0)
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(grepl("session$onFlushed(function()",x,fixed=TRUE))
          stopifnot(grepl("login_initialising(TRUE)",x,fixed=TRUE))
          stopifnot(grepl("login_initialising(FALSE)",x,fixed=TRUE))
          stopifnot(grepl("authenticated(TRUE)",x,fixed=TRUE))
          stopifnot(grepl("loaded_assignments <- read_assignment_registry",x,fixed=TRUE))
          stopifnot(grepl('mark_review_complete("04"',x,fixed=TRUE))
          stopifnot(grepl("output$configure_review_contents <- renderUI",x,fixed=TRUE))
          cat("PASS: R parses and legacy queue initialisation retained behind onFlushed callback\n")
