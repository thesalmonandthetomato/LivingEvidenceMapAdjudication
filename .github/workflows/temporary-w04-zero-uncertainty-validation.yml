name: Temporary W04 zero uncertainty UI validation
on:
  push:
    paths: ['.github/workflows/temporary-w04-zero-uncertainty-validation.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse Shiny and inspect zero-uncertainty state reset
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          needle <- 'Opened run %s: no model uncertainties requiring adjudication.'
          i <- regexpr(needle,x,fixed=TRUE)[1]
          stopifnot(i>0)
          before <- substr(x,max(1,i-650),i)
          for(term in c('w04_resolution_all_cases_rv(list())','w04_resolution_queue_sha_rv("")','w04_resolution_batch_id_rv("")','w04_resolution_source_run_id_rv("")','w04_resolution_decisions(list())'))
            stopifnot(grepl(term,before,fixed=TRUE))
          stopifnot(grepl('Model uncertainty queue count differs from batch registry',x,fixed=TRUE))
          cat("PASS W04 model batch zero-case reset and queue count guard\n")
