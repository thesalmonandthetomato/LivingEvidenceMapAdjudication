name: Temporary W04 prompt save regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-prompt-save-regression.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Regression test first save and checksum manifest
        shell: Rscript {0}
        run: |
          install.packages('digest',repos='https://cloud.r-project.org')
          parse(file='multiuser_app/R/w04_prompt_zenodo.R')
          parse(file='multiuser_app/R/w04_prompt_versions.R')
          parse(file='multiuser_app/app.R')
          source('multiuser_app/R/w04_prompt_versions.R')
          source('multiuser_app/R/w04_prompt_zenodo.R')
          empty_meta <- list(values=c(review_id='almeria-map'))
          stopifnot(identical(w04_prompt_draft_id(empty_meta),''))
          registered <- list(values=c(review_id='almeria-map',
                                      w04_prompt_zenodo_draft_id='123456'))
          stopifnot(identical(w04_prompt_draft_id(registered),'123456'))
          version <- w04_prompt_version('almeria-map','Test text','tester')
          manifest <- w04_prompt_manifest(list(version))
          stopifnot(length(manifest)==1L,
                    identical(manifest[[1]]$sha256,version$sha256),
                    is.null(manifest[[1]]$content))
          bad <- version
          bad$content <- 'Changed'
          rejected <- tryCatch({w04_prompt_manifest(list(bad));FALSE},
                               error=function(e)TRUE)
          stopifnot(rejected)
          cat('PASS: absent draft ID, persisted draft ID, valid and altered manifests\n')
