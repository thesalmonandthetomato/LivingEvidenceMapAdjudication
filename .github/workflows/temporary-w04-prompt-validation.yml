name: Temporary W04 prompt versioning validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-prompt-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate W04 prompt parser and UI syntax
        shell: Rscript {0}
        run: |
          for(p in c('multiuser_app/R/w04_prompt_versions.R',
                     'multiuser_app/R/w04_prompt_zenodo.R',
                     'multiuser_app/app.R')) {
            parse(file=p)
            cat('PASS syntax:',p,'\n')
          }
          install.packages('digest', repos='https://cloud.r-project.org')
          source('multiuser_app/R/w04_prompt_versions.R')
          a <- w04_prompt_version('almeria-map','An example relevance screening prompt',
                                  'validation-user',notes='synthetic validation')
          stopifnot(grepl('^w04-',a$version_id),identical(a$status,'draft'),
                    identical(a$sha256,w04_prompt_checksum(a$content)))
          stopifnot(identical(w04_prompt_manifest(list(a))[[1]]$sha256,a$sha256))
          stopifnot(!('content' %in% names(w04_prompt_manifest(list(a))[[1]])))
          txt <- tempfile(fileext='.txt')
          writeLines('Synthetic prompt',txt)
          stopifnot(identical(w04_prompt_from_upload(txt,'prompt.txt'),'Synthetic prompt'))
          unlink(txt)
          cat('PASS W04 synthetic provenance, manifest and TXT upload tests\n')

