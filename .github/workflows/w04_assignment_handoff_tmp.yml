name: W04 assignment handoff validation temporary
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install and verify test dependencies
        shell: Rscript {0}
        run: |
          needed <- c("jsonlite","digest")
          install.packages(needed,dependencies=c("Depends","Imports","LinkingTo"),quiet=FALSE)
          for(pkg in needed)stopifnot(requireNamespace(pkg,quietly=TRUE))
      - name: Validate saved conflict activation independently of archive downloads
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          `%||%` <- function(x,y)if(is.null(x))y else x
          source("multiuser_app/R/w04_blind_resolution.R",local=FALSE)
          source("multiuser_app/R/w04_model_batches.R",local=FALSE)
          source("multiuser_app/R/w04_model_conflicts.R",local=FALSE)
          w04_normalise_screening_decision <- function(x) as.character(x %||% "")
          sha <- paste(rep("a",64),collapse="")
          batch <- list(run_id="39046381271",subset_id="subset",total="2",uncertain="0",
            model_sha256=sha,prompt_sha256=paste(rep("b",64),collapse=""))
          set <- list(parent_batch_id="w04-model-run-39046381271",
            comparison_type="human_model",parent_queue_sha256=sha,
            rater_ids_json='["usr-matthew","model"]',
            conflict_case_ids_json='["r1"]',analysis_id="a1",conflict_set_id="c1")
          w04_prompt_review_metadata <- function()list(review_id="review")
          w04_model_batch_registry_read <- function(review_id)list(batch)
          w04_subset_queue_read <- function(subset_id,review_id)list(queue_sha256="human-sha",cases=list())
          w04_filter_batch_decisions <- function(events,queue_sha256)list()
          active_sheet_w04_decisions <- function()list()
          w04_blind_case_outcomes <- function(cases,assignments,decisions,batch_id,task_type){
            make <- function(id,decision)list(case_id=id,record_id=id,status="single_human",
              assigned_user_ids="usr-matthew",completed_user_ids="usr-matthew",
              reviewer_decisions=list("usr-matthew"=list(decision=decision,complete=TRUE)),
              case=list(record_id=id,review_case_id=id,bibliographic=list(title=id)))
            list(make("r1","retain"),make("r2","exclude"))
          }
          w04_model_batch_results_read <- function(batch)data.frame(record_id=c("r1","r2"),
            decision=c("exclude","exclude"),result_json=c('{"screening":{"votes":["exclude"]}}',
              '{"screening":{"votes":["exclude"]}}'),stringsAsFactors=FALSE)
          w04_model_vote_reasons_from_artifacts <- function(...)stop("Archive must not be downloaded on activation")
          cases <- w04_model_conflict_reconstruct(set,list())
          stopifnot(length(cases)==1L,identical(cases[[1]]$record_id,"r1"),
            identical(cases[[1]]$blind_review$reviewer_decisions$model$decision,"exclude"),
            identical(cases[[1]]$blind_review$reviewer_decisions[["usr-matthew"]]$decision,"retain"))
          bad <- set;bad$conflict_case_ids_json <- '["r2"]'
          stopifnot(inherits(try(w04_model_conflict_reconstruct(bad,list()),silent=TRUE),"try-error"))
          lines <- readLines("multiuser_app/app.R",warn=FALSE)
          strings <- paste(lines,collapse="\n")
          stopifnot(sum(grepl('uiOutput("w04_model_conflict_task_loader")',lines,fixed=TRUE))==1L)
          stopifnot(grepl('workflow_sections_display,',strings,fixed=TRUE))
          stopifnot(grepl('uiOutput("w04_model_conflict_task_loader")',strings,fixed=TRUE))
          stopifnot(grepl('w04_load_conflict_vote_reasons',strings,fixed=TRUE))
          cat("PASS: conflict activation does not wait for model explanations; existing decisions preserved; assignment panel offers loader. No paid calls.\n")
