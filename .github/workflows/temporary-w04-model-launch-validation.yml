name: Temporary W04 Shiny model launch functional validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w04-model-launch-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate W04 Shiny bundle safety
        shell: Rscript {0}
        run: |
          install.packages(c('jsonlite','digest'),repos='https://cloud.r-project.org')
          parse(file='multiuser_app/app.R')
          parse(file='multiuser_app/R/w04_shiny_model_launch.R')
          parse(file='multiuser_app/R/w04_subset_review_source.R')
          source('multiuser_app/R/w04_shiny_model_launch.R',local=TRUE)
          `%||%` <- function(x,y) if(is.null(x)||length(x)==0L)y else x
          w04_prompt_checksum <- function(x) digest::digest(enc2utf8(x),algo='sha256',serialize=FALSE)
          id <- paste0('w04-subset-',strrep('a',20))
          sha <- strrep('c',64)
          meta <- list(review_id='almeria-map')
          subset <- list(subset_id=id,record_ids=c('a','b'),source_checkpoint_sha256=strrep('d',64))
          queue <- list(subset_id=id,queue_sha256=sha,
            cases=list(list(review_case_id=paste0(id,'|a'),record_id='a'),
                       list(review_case_id=paste0(id,'|b'),record_id='b')))
          prompt <- list(review_id='almeria-map',
            version_id=paste0('w04-',strrep('e',20)),content='Model instructions',
            sha256=w04_prompt_checksum('Model instructions'))
          ds <- list(list(review_case_id=paste0(id,'|a'),decision='retain'),
                     list(review_case_id=paste0(id,'|b'),decision='exclude'))
          edit <- list(review_case_id=paste0(id,'|a'),record_id='a',
            queue_sha256=sha,abstract='Verified abstract',reviewer='usr-neal',
            edit_id='edit1',saved_at_utc='2026-10-16T12:00:00Z')
          b <- w04_shiny_model_bundle_build(meta,subset,queue,prompt,ds,list(edit))
          stopifnot(length(b$record_ids)==2L,length(b$abstract_corrections)==1L)
          must_fail <- function(expr) {
            z <- tryCatch({force(expr);FALSE},error=function(e)TRUE)
            stopifnot(z)
          }
          must_fail(w04_shiny_model_bundle_build(meta,subset,queue,prompt,ds[-1],list(edit)))
          conflict <- edit
          conflict$abstract <- 'Different text'
          conflict$reviewer <- 'usr-sini'
          must_fail(w04_shiny_model_bundle_build(meta,subset,queue,prompt,ds,list(edit,conflict)))
          bad <- subset
          bad$record_ids <- c('a','unknown')
          must_fail(w04_shiny_model_bundle_build(meta,bad,queue,prompt,ds,list()))
          cat('PASS review-scoped W04 model bundle and conflict/completeness rejection\n')
