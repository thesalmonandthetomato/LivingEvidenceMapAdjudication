name: Temporary W04 loading feedback check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-loading-feedback-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate app and all loading feedback callbacks
        shell: Rscript {0}
        run: |
          parse(file='multiuser_app/app.R')
          text <- paste(readLines('multiuser_app/app.R',warn=FALSE),collapse='\\n')
          for (id in c('w04_prompt_refresh','w04_subset_registry_refresh','w04_subset_load_corpus')) {
            stopifnot(grepl(paste0('lemBusyStart(\'',id,'\''),text,fixed=TRUE),
                      grepl(paste0('list(id="',id,'")'),text,fixed=TRUE))
          }
          stopifnot(grepl('lem_busy_finished',text,fixed=TRUE))
          cat('PASS busy indicator and completion wiring\\n')
