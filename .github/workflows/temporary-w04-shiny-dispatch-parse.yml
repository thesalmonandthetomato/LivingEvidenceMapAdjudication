name: Temporary Shiny W04 dispatch syntax check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w04-shiny-dispatch-parse.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse Shiny dispatch
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/R/github_dispatch.R")
          cat("PASS W04 Shiny resume dispatch syntax\n")
