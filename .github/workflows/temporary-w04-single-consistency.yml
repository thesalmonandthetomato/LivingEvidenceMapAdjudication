name: Temporary W04 single consistency section
on:
  push:
    paths: ['.github/workflows/temporary-w04-single-consistency.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse Shiny and verify single panel with subset selector
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          for(term in c("w04_consistency_subset_selector","w04_consistency_subset_load","w04_consistency_subset_snapshot_rv","workflow_sections_display <- c(workflow_sections_display,list(w04_results_panel))"))
            stopifnot(grepl(term,x,fixed=TRUE))
          stopifnot(!grepl("workflow_sections_display[[length(workflow_sections_display)+1L]] <- w04_results_panel",x,fixed=TRUE))
          cat("PASS single W04 consistency panel and subset selector\n")
