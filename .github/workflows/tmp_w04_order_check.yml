name: Temporary W04 overview order check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_w04_order_check.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Parse R and validate sorting contract
        shell: Rscript {0}
        run: |
          invisible(parse(file="multiuser_app/app.R"))
          invisible(parse(file="multiuser_app/R/w04_work_overview_sheets.R"))
          a <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          s <- paste(readLines("multiuser_app/R/w04_work_overview_sheets.R",warn=FALSE),collapse="\n")
          stopifnot(!grepl('actionButton("w04_overview_backfill"',a,fixed=TRUE))
          stopifnot(grepl('x <- x[order(times,decreasing=TRUE,na.last=TRUE)]',s,fixed=TRUE))
          stopifnot(grepl('oldest_first <- function(rows)',s,fixed=TRUE))
          stopifnot(grepl('subsets=bind(oldest_first(subset_rows)',s,fixed=TRUE))
          cat("PASS: newest-state selection preserved and overview displays oldest first\n")
