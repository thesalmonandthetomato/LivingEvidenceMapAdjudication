name: Temporary W04 KPI and Finalise regression
on:
  push:
    paths: ['.github/workflows/w04-kpi-finalise-temporary.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install test dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest'))
      - name: Parse Shiny and test existing W04 registries
        run: |
          Rscript -e 'parse(file="multiuser_app/app.R")'
          cd multiuser_app
          Rscript tests/test_w04_model_coverage_reconstruction.R
          Rscript tests/test_w04_corpus_reconciliation.R
          Rscript tests/test_w04_reconciled_export.R
          python - <<'PY'
          from pathlib import Path
          s=Path('app.R').read_text()
          assert 'm <- manual_screening_rv()' in s
          assert 'm <- if(review_mode) NULL else manual_screening_rv()' not in s
          assert 'kpi("Latest model batch"' not in s
          assert 'read_manual_screening_metrics(),error=function(e)e' in s
          print('PASS KPI and Finalise text bindings')
          PY
