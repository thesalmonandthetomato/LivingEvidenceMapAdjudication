name: Temporary W04 exact abstract regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w04-exact-abstract.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Verify no partial matching of abstract enrichment
        shell: Rscript {0}
        run: |
          path <- 'multiuser_app/R/w04_subset_queue_builder.R'
          parse(file=path)
          src <- paste(readLines(path,warn=FALSE),collapse='\n')
          stopifnot(grepl('c[["abstract"]],r[["abstract"]]',src,fixed=TRUE))
          expr <- quote(w04_subset_screening_first(c[["abstract"]],r[["abstract"]]))
          w04_subset_screening_text <- function(x) {
            if(is.null(x)) return('')
            if(is.atomic(x)) return(paste(as.character(x[!is.na(x)]),collapse='; '))
            if(is.list(x)) return(paste(Filter(nzchar,vapply(x,w04_subset_screening_text,character(1))),collapse='; '))
            ''
          }
          w04_subset_screening_first <- function(...) {
            for (x in list(...)) {
              value <- trimws(w04_subset_screening_text(x))
              if(nzchar(value)) return(value)
            }
            ''
          }
          r <- list(abstract_enrichment=list(status='pending_workflow02',manifestations_missing_abstract=1))
          c <- list()
          stopifnot(identical(eval(expr),''))
          c <- list(abstract='Real abstract from canonical record')
          stopifnot(identical(eval(expr),'Real abstract from canonical record'))
          cat('PASS W04 missing abstracts cannot resolve to abstract_enrichment\n')
