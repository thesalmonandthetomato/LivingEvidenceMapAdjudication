name: Temporary validate login timing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-login-timing-validation-20261016.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Parse application and verify timings
        shell: Rscript {0}
        run: |
          parse("multiuser_app/app.R")
          lines <- readLines("multiuser_app/app.R",warn=FALSE)
          source <- paste(lines,collapse="\n")
          for (name in c("assignments","pipeline status","manual screening metrics","W01 queue","W02 queue","W04 queue","W04 resolution queue","W04 conflict queue","W08 queue"))
            stopifnot(grepl(paste0('login_timed_read("',name,'"'),source,fixed=TRUE))
          stopifnot(grepl('session$onFlushed(function()',source,fixed=TRUE))
          cat("PASS: R syntax and all nine read-only login timers present\n")
