name: Temporary W04 uncertainty view check
on:
  push:
    paths: ['.github/workflows/temporary-w04-uncertainty-view-check.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate uncertainty viewer and loading feedback
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          for(term in c("Opening model uncertainties","[W04 timing] open_model_uncertainties",
            "w04_resolution_highlight_include <- reactive({",
            "w04_resolution_highlight_exclude <- reactive({",
            "if(length(configured)) configured else w04_include_terms()",
            "if(length(configured)) configured else w04_exclude_terms()"))
            stopifnot(grepl(term,x,fixed=TRUE))
          cat("PASS W04 uncertainty viewer terms and immediate feedback\n")
