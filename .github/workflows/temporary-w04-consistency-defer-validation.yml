name: Temporary W04 consistency defer validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w04-consistency-defer-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Validate syntax and disclosure gating
        shell: Rscript {0}
        run: |
          parse("multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(grepl("observeEvent(input$w04_consistency_opened, {",x,fixed=TRUE))
          stopifnot(grepl("Shiny.setInputValue('w04_consistency_opened', true",x,fixed=TRUE))
          stopifnot(grepl("!isTRUE(w04_consistency_history_loaded()) || nrow",x,fixed=TRUE))
          stopifnot(grepl("analyses=read_w04_consistency_analyses()",x,fixed=TRUE))
          stopifnot(grepl("human_kappa=read_w04_human_kappa_registry()",x,fixed=TRUE))
          stopifnot(grepl("w04_conflict_sets_rv(login_timed_read(\"W04 conflict sets\",read_w04_conflict_sets))",x,fixed=TRUE))
          cat("PASS: consistency history gated, reviewer conflict queue retained\n")
