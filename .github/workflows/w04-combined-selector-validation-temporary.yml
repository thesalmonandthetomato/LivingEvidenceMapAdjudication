name: Temporary W04 combined selection validation
on:
  push:
    paths:
      - '.github/workflows/w04-combined-selector-validation-temporary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Dependencies
        run: Rscript -e 'install.packages("digest",repos="https://cloud.r-project.org")'
      - name: Parse R sources
        run: |
          Rscript -e 'for(f in c("multiuser_app/app.R",list.files("multiuser_app/R",pattern="[.]R$",full.names=TRUE))) parse(file=f)'
      - name: W04 combined selection tests
        working-directory: multiuser_app
        run: Rscript tests/test_w04_model_selection.R
      - name: Assert non-exclusive controls
        run: |
          grep -q 'w04_include_remaining' multiuser_app/app.R
          grep -q 'Additional subsets (optional)' multiuser_app/app.R
