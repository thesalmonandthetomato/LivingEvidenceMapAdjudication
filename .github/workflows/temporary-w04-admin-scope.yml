name: Temporary W04 administration scope regression
on:
  push:
    paths: ['.github/workflows/temporary-w04-admin-scope.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Check W04 selected subset scope and Shiny syntax
        shell: Rscript {0}
        run: |
          parsed <- parse(file="multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          manual <- regexpr('manual_ids <- vapply(manual_groups',x,fixed=TRUE)[1]
          chosen <- regexpr('chosen_manual <- as.character(input$w04_admin_manual_subset',x,fixed=TRUE)[1]
          sections <- regexpr('workflow_sections <- lapply(group_progress',x,fixed=TRUE)[1]
          selector <- regexpr('selectInput("w04_admin_manual_subset"',x,fixed=TRUE)[1]
          stopifnot(manual>0,chosen>manual,sections>chosen,selector>sections)
          stopifnot(length(gregexpr('chosen_manual <- as.character(input$w04_admin_manual_subset',x,fixed=TRUE)[[1]])==1L)
          cat("PASS: app parses and W04 subset selectors defined before UI render\n")
