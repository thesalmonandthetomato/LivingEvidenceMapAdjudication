name: W05 Shiny pathway isolated validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'multiuser_app/R/w05_crop_coding.R'
      - 'multiuser_app/R/w05_crop_archive.R'
      - 'multiuser_app/R/w05_shiny_subset_dispatch.R'
      - 'multiuser_app/R/w05_shiny_subset_results.R'
      - 'multiuser_app/app.R'
      - 'multiuser_app/scripts/w05_crop_worker.R'
      - 'multiuser_app/scripts/w05_shiny_restore_inputs.R'
      - '.github/workflows/w05_shiny_subset.yml'
      - 'multiuser_app/tests/test_w05_crop_coding.R'
      - 'multiuser_app/config/w05_almeria_crop_dictionary.csv'
      - '.github/workflows/w05_shiny_validation.yml'
permissions:
  contents: read
jobs:
  validate-w05-shiny:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install minimal R dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite","digest"))
      - name: Parse Shiny W05 code without launching the app
        working-directory: multiuser_app
        shell: Rscript {0}
        run: |
          for (p in c("R/w05_crop_coding.R", "R/w05_crop_archive.R", "R/w05_shiny_subset_dispatch.R", "R/w05_shiny_subset_results.R", "scripts/w05_crop_worker.R", "scripts/w05_shiny_restore_inputs.R", "app.R")) parse(file=p)
          cat("PASS W05 Shiny parse\n")
      - name: Run independent W05 regression tests
        working-directory: multiuser_app
        shell: Rscript {0}
        run: source("tests/test_w05_crop_coding.R")
      - name: Smoke-test offline subset and full-corpus execution
        working-directory: multiuser_app
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"identity":{"record_id":"test-01"},"canonical":{"title":"Tomato irrigation","abstract":""}}' '{"identity":{"record_id":"test-02"},"canonical":{"title":"No named crop","abstract":""}}' > "$RUNNER_TEMP/w05-fixture.jsonl"
          Rscript scripts/w05_crop_worker.R --input "$RUNNER_TEMP/w05-fixture.jsonl" --dictionary config/w05_almeria_crop_dictionary.csv --output-dir "$RUNNER_TEMP/w05-subset" --subset-count 1
          Rscript scripts/w05_crop_worker.R --input "$RUNNER_TEMP/w05-fixture.jsonl" --dictionary config/w05_almeria_crop_dictionary.csv --output-dir "$RUNNER_TEMP/w05-full" --full-corpus
          test "$(($(wc -l < "$RUNNER_TEMP/w05-subset/w05_crop_assignments.csv") - 1))" -ge 1
          test "$(($(wc -l < "$RUNNER_TEMP/w05-full/w05_crop_assignments.csv") - 1))" -ge 2
          grep -q 'unspecified_horticultural_crop' "$RUNNER_TEMP/w05-full/w05_crop_assignments.csv"
          echo 'PASS isolated W05 subset/full-corpus smoke tests'
