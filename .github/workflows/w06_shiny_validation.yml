name: W06 Shiny prompt configuration validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'multiuser_app/R/w06_shiny_prompt.R'
      - 'multiuser_app/tests/test_w06_shiny_prompt.R'
      - 'multiuser_app/app.R'
      - '.github/workflows/w06_shiny_validation.yml'
permissions:
  contents: read
jobs:
  validate-prompt-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install minimal test dependencies
        shell: Rscript {0}
        run: install.packages(c("digest","jsonlite"))
      - name: Parse W06 Shiny prompt configuration and app
        working-directory: multiuser_app
        shell: Rscript {0}
        run: |
          parse(file="R/w06_shiny_prompt.R")
          parse(file="app.R")
          cat("PASS W06 prompt module and app parse\n")
      - name: Run offline prompt regression checks
        working-directory: multiuser_app
        shell: Rscript {0}
        run: source("tests/test_w06_shiny_prompt.R")
