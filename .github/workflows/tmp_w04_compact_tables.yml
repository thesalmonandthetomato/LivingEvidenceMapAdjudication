name: Temporary W04 compact tables regression
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Test W04 overview table order and compact presentation
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          if(!requireNamespace("jsonlite",quietly=TRUE)) install.packages("jsonlite",quiet=TRUE)
          `%||%` <- function(x,y)if(is.null(x))y else x
          source("multiuser_app/R/w04_workspace_overview.R")
          s <- function(id,d) list(subset_id=id,actual_size="100",created_at_utc=d)
          p <- function(id,d) list(version_id=id,created_at_utc=d)
          r <- function(id,d) list(run_id=id,subset_id="w04-subset-abcdef",
            prompt_version_id="w04-prompt-abcdef",published_at_utc=d,total="100",uncertain="0")
          a <- function(id,d) list(analysis_id=id,batch_id="w04-model-run-123",created_at_utc=d,
            rater_ids_json='["model"]',conflict_n="2")
          old <- "2026-10-14T10:00:00Z"
          new <- "2026-10-17T10:00:00Z"
          x <- w04_overview_build(
            list(s("w04-subset-abcdef",old),s("w04-subset-ghijkl",new)),
            list(p("w04-prompt-abcdef",old),p("w04-prompt-ghijkl",new)),
            list(r("123",old),r("456",new)),
            list(a("a",old),a("b",new)),list(),list(),list(),list(),list())
          stopifnot(nrow(x$subsets)==2L,nrow(x$prompts)==2L,nrow(x$runs)==2L,
            nrow(x$comparisons)==2L,
            x$runs$Run[1]=="456",x$subsets$Subset[1]=="Subset ghijkl",
            x$comparisons$Created[1]!=x$comparisons$Created[2],
            !("ID" %in% names(x$subsets)),
            !("ID" %in% names(x$comparisons)),
            "Models" %in% names(x$prompts),
            "Done" %in% names(x$subsets))
          app <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(grepl("w04-compact-overview",app,fixed=TRUE))
          cat("PASS newest-first dates, compact labels and columns, code syntax.\n")
