name: Temporary W04 admin assignment visibility validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-admin-assignment-view.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate registered subset assignment summary
        shell: Rscript {0}
        run: |
          parse(file='multiuser_app/app.R')
          x<-paste(readLines('multiuser_app/app.R',warn=FALSE),collapse='\n')
          stopifnot(grepl('Preserve every batch in the summary.',x,fixed=TRUE),
                    grepl('w04_subset_queue_read(subset_id,meta$review_id)',x,fixed=TRUE),
                    grepl('w04_filter_batch_decisions(all,queue$queue_sha256)',x,fixed=TRUE),
                    grepl('Registered subset assignments are shown above.',x,fixed=TRUE))
          cat('PASS admin can see registered W04 batch assignments independent of personal queue\n')
