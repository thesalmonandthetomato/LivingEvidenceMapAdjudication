name: Temporary W04 menu and KPI regression
on:
  push:
    paths:
      - '.github/workflows/w04-menu-kpi-temporary.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install offline packages
        shell: Rscript {0}
        run: install.packages(c("digest","jsonlite"))
      - name: Parse Shiny and verify streamlined menu and persisted KPI
        run: |
          Rscript -e 'parse(file="multiuser_app/app.R");parse(file="multiuser_app/R/github_dispatch.R")'
          python - <<'PY'
          from pathlib import Path
          a = Path("multiuser_app/app.R").read_text()
          b = Path("multiuser_app/R/github_dispatch.R").read_text()
          assert '1. Prepare screening' in a
          assert '2. Run selected W04 model screening' in a
          assert 'uiOutput("w04_model_launch_control")' in a
          assert 'actionButton("w04_reconstructed_verify"' not in a
          assert 'w04_subset_load_eligible(source$lean,source$w03)' in a
          assert 'p$search_results_total <- published$search_results_ingested' in a
          assert 'source records ingested (W01)' in a
          assert 'source_manifestations' in b
          print("PASS: W04 two-step menu and persisted source-count fallback")
          PY
      - name: Regress offline W04 reconciliation
        run: |
          cd multiuser_app
          Rscript tests/test_w04_reconstructed_selection.R
          Rscript tests/test_w04_reconstructed_launcher.R
          Rscript tests/test_w04_reconciled_export.R
