name: Temporary W04 admin split validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_w04_admin_split.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Parse R and check W04 admin output grouping
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          s <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(grepl("admin_assignment_panels <- reactive",s,fixed=TRUE))
          stopifnot(grepl("output$w04_admin_controls <- renderUI",s,fixed=TRUE))
          stopifnot(grepl("w04_sections_display <- workflow_sections[w04_indices]",s,fixed=TRUE))
          stopifnot(grepl("other_sections_display <- workflow_sections[other_indices]",s,fixed=TRUE))
          stopifnot(length(gregexpr('actionButton("open_administration_assignments"',s,fixed=TRUE)[[1]])==1L)
          cat("PASS: W04 controls separated from other workflow assignment controls\n")
