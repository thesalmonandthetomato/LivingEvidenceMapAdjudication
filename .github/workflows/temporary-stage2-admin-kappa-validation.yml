name: Temporary Stage 2 admin kappa validation
on:
  push:
    paths:
      - '.github/workflows/temporary-stage2-admin-kappa-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Verify R parse and deferred loading
        shell: Rscript {0}
        run: |
          file <- 'multiuser_app/app.R'
          parse(file=file)
          lines <- readLines(file, warn=FALSE)
          stopifnot(sum(grepl('kappa_result <- tryCatch(read_manual_screening_metrics()', lines, fixed=TRUE)) == 1L)
          stopifnot(!any(grepl('manual_screening_rv(login_timed_read',lines,fixed=TRUE)))
          cat('PASS: deferred W04 kappa loading and R syntax\n')
