name: Validate production Shiny app and build Connect Cloud manifest

on:
  push:
    branches: [main]
    paths:
      - 'app.R'
      - 'R/**'
      - 'fixtures/**'
      - 'tests/**'
      - '!manifest.json'
      - 'scripts/make_manifest.R'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shiny-validate-manifest-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("rsconnect","shiny","bslib","jsonlite","digest","googlesheets4","httr2","countrycode"))

      - name: Parse production application files
        shell: Rscript {0}
        run: |
          parse(file="app.R")
          for (f in list.files("R", pattern="\\.R$", full.names=TRUE)) parse(file=f)
          cat("PASS: production R files parse\n")

      - name: Run production regression suite
        shell: Rscript {0}
        run: |
          source("tests/test_w01_contract.R")
          source("tests/test_assignments.R")
          source("tests/test_decision_events.R")
          source("tests/test_local_assignments.R")
          source("tests/test_w01_decision_events.R")
          source("tests/test_users.R")
          source("tests/test_auth.R")
          source("tests/test_phase1c_permissions.R")
          source("tests/test_w04_validation_lifecycle.R")
          source("tests/test_w04_blind_resolution.R")
          source("tests/test_w04_validation_dispatch.R")
          source("tests/test_w04_kappa_registry.R")
          source("tests/test_preproduction_contract.R")
          source("tests/test_w08_canonical_kpi.R")
          source("tests/test_backend_reset_contract.R")
          cat("PASS: production multi-user adjudication regression suite\n")

      - name: Generate production Connect Cloud manifest
        shell: Rscript {0}
        run: |
          rsconnect::writeManifest(appDir=".")
          stopifnot(file.exists("manifest.json"))
          cat("PASS: root production manifest generated\n")

      - name: Commit production manifest if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "PASS: origin/main moved during validation; skipping stale manifest commit"
            exit 0
          fi

          if git show origin/main:manifest.json > "$RUNNER_TEMP/remote-root-manifest.json" 2>/dev/null &&
             cmp -s manifest.json "$RUNNER_TEMP/remote-root-manifest.json"; then
            echo "PASS: root production manifest already current on origin/main"
            exit 0
          fi

          git add manifest.json
          if git diff --cached --quiet; then
            echo "PASS: manifest already current"
            exit 0
          fi

          git commit -m "build: update production Connect Cloud manifest"
          git push origin HEAD:main
