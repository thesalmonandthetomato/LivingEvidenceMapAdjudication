name: Validate and build Connect Cloud manifest

on:
  push:
    branches: [main]
    paths:
      - 'app.R'
      - 'R/**'
      - 'fixtures/**'
      - 'tests/**'
      - 'multiuser_app/**'
      - '!multiuser_app/manifest.json'
      - 'scripts/make_manifest.R'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shiny-validate-manifest-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("rsconnect","shiny","bslib","jsonlite","digest","googlesheets4","httr2","countrycode"))

      - name: Parse application files
        shell: Rscript {0}
        run: |
          parse(file="app.R")
          parse(file="R/auth.R")
          parse(file="R/github_dispatch.R")
          parse(file="R/storage_backend.R")
          parse(file="R/storage_local.R")
          parse(file="R/storage_sheets.R")
          parse(file="R/w01_contract.R")
          cat("PASS: R files parse\n")

      - name: Test W01 contract
        shell: Rscript {0}
        run: source("tests/test_w01_contract.R")

      - name: Parse multi-user application files
        shell: Rscript {0}
        working-directory: multiuser_app
        run: |
          parse(file="app.R")
          for (f in list.files("R", pattern="\\.R$", full.names=TRUE)) parse(file=f)
          cat("PASS: multi-user R files parse\n")

      - name: Test multi-user adjudication core
        shell: Rscript {0}
        working-directory: multiuser_app
        run: |
          source("tests/test_assignments.R")
          source("tests/test_decision_events.R")
          source("tests/test_local_assignments.R")
          source("tests/test_w01_decision_events.R")
          source("tests/test_users.R")
          source("tests/test_auth.R")
          source("tests/test_phase1c_permissions.R")
          source("tests/test_w04_validation_lifecycle.R")
          source("tests/test_w04_blind_resolution.R")
          source("tests/test_w04_validation_dispatch.R")
          source("tests/test_preproduction_contract.R")
          source("tests/test_w08_canonical_kpi.R")
          cat("PASS: multi-user adjudication core tests\n")


      - name: Generate Connect Cloud manifests
        shell: Rscript {0}
        run: |
          rsconnect::writeManifest(appDir=".")
          rsconnect::writeManifest(appDir="multiuser_app")
          stopifnot(file.exists("manifest.json"))
          stopifnot(file.exists("multiuser_app/manifest.json"))
          cat("PASS: root and multi-user manifests generated\n")

      - name: Commit manifest if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          # If main moved while this run was validating, do not try to rebase a
          # generated manifest commit over newer application/manifests. The
          # newer push has (or will have) its own validation run.
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "PASS: origin/main moved during validation; skipping stale manifest commit"
            exit 0
          fi

          root_same=false
          multi_same=false

          if git show origin/main:manifest.json > "$RUNNER_TEMP/remote-root-manifest.json" 2>/dev/null &&
             cmp -s manifest.json "$RUNNER_TEMP/remote-root-manifest.json"; then
            root_same=true
          fi

          if git show origin/main:multiuser_app/manifest.json > "$RUNNER_TEMP/remote-multi-manifest.json" 2>/dev/null &&
             cmp -s multiuser_app/manifest.json "$RUNNER_TEMP/remote-multi-manifest.json"; then
            multi_same=true
          fi

          if [ "$root_same" = true ] && [ "$multi_same" = true ]; then
            echo "PASS: root and multi-user manifests already current on origin/main"
            exit 0
          fi

          git add manifest.json multiuser_app/manifest.json
          if git diff --cached --quiet; then
            echo "PASS: manifests already current"
            exit 0
          fi

          git commit -m "build: update Connect Cloud manifests"
          git push origin HEAD:main
