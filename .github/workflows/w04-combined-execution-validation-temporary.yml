name: Temporary W04 combined execution validation
on:
  push:
    paths:
      - '.github/workflows/w04-combined-execution-validation-temporary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install minimal tests dependencies
        run: Rscript -e 'install.packages("digest",repos="https://cloud.r-project.org")'
      - name: Parse Shiny app and R modules
        run: |
          Rscript -e 'for(f in c("multiuser_app/app.R",list.files("multiuser_app/R",pattern="[.]R$",full.names=TRUE)))parse(file=f)'
      - name: Verify W04 record selection
        working-directory: multiuser_app
        run: Rscript tests/test_w04_model_selection.R
      - name: Verify immutable combined execution and resumption
        working-directory: multiuser_app
        run: Rscript tests/test_w04_combined_execution.R
