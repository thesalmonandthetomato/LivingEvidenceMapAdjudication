name: Temporary Shiny W04 validation
on:
  push:
    paths:
      - .github/workflows/w04_shiny_temp_validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: multiuser_app
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse Shiny and W04 support modules
        shell: Rscript {0}
        run: |
          files <- c("app.R", "R/w04_shiny_model_launch.R",
                     "R/w04_model_batches.R", "R/w04_kappa_registry.R",
                     "R/w04_human_kappa_registry.R")
          for(f in files) {parse(file=f);cat("PASS:",f,"\n")}
      - name: Verify dispatch and feature guard contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'w04_finalise_publication_dispatch <- function' R/w04_shiny_model_launch.R
          grep -q 'LEM_W04_SHINY_PUBLISH_ENABLED' app.R
          grep -q 'w04_shiny_reconciled_publish.yml' R/w04_shiny_model_launch.R
          echo "PASS Shiny publication activation guard"
