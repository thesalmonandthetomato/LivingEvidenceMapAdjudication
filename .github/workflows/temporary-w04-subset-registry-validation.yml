name: Temporary W04 subset registry validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-subset-registry-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate W04 subset deterministic sampling and storage modules
        shell: Rscript {0}
        run: |
          install.packages(c('digest','jsonlite'),repos='https://cloud.r-project.org')
          for (p in c('multiuser_app/R/w04_subset_registry.R','multiuser_app/R/w04_subset_storage.R','multiuser_app/app.R')) parse(file=p)
          source('multiuser_app/R/w04_subset_registry.R')
          source('multiuser_app/R/w04_subset_storage.R')
          ids <- sprintf('canonical-%03d',seq_len(300))
          sha <- paste(rep('a',64),collapse='')
          a <- w04_subset_create('almeria-map',ids,300,123,
                 source_checkpoint_sha256=sha,created_by='usr-test')
          stopifnot(w04_subset_verify(a),length(unique(a$record_ids))==300)
          b <- w04_subset_create('almeria-map',ids,100,456,parent=a,
                 source_checkpoint_sha256=sha,created_by='usr-test')
          c <- w04_subset_create('almeria-map',ids,100,456,parent=a,
                 source_checkpoint_sha256=sha,created_by='usr-test')
          stopifnot(identical(b$record_ids,c$record_ids),identical(b$subset_id,c$subset_id),
                    all(b$record_ids %in% a$record_ids))
          x <- w04_subset_pool_remainder(ids,list(b))
          stopifnot(length(x)==200L,length(intersect(x,b$record_ids))==0L)
          d <- w04_subset_create('almeria-map',x,20,99,
                 source_checkpoint_sha256=sha,created_by='usr-test')
          stopifnot(w04_subset_verify(d),!any(d$record_ids %in% b$record_ids))
          tamper <- b
          tamper$record_ids[[1]] <- 'wrong'
          failed <- tryCatch({w04_subset_verify(tamper);FALSE},error=function(e)TRUE)
          stopifnot(failed)
          js <- jsonlite::toJSON(b,auto_unbox=TRUE)
          z <- jsonlite::fromJSON(js,simplifyVector=FALSE)
          z$record_ids <- unlist(z$record_ids,use.names=FALSE)
          stopifnot(w04_subset_verify(z))
          cat('PASS W04 subset sample determinism, nesting, remaining pool, integrity and JSON round-trip\n')
