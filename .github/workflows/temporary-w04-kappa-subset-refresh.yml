name: Temporary W04 kappa subset registry validation
on:
  push:
    paths: ['.github/workflows/temporary-w04-kappa-subset-refresh.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate registry-backed subset selector
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          s <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(grepl('w04_consistency_registry_rv()',s,fixed=TRUE))
          stopifnot(grepl('refresh_w04_consistency_registry()',s,fixed=TRUE))
          stopifnot(grepl('w04_consistency_subset_refresh',s,fixed=TRUE))
          stopifnot(grepl('if(length(w04_consistency_registry_rv())) return()',s,fixed=TRUE))
          stopifnot(grepl('The list has been refreshed; select a subset',s,fixed=TRUE))
          cat("PASS W04 subset selector registry-backed refresh and R syntax\n")
