name: Temporary W04 manual subset selector validation
on:
  push:
    paths: ['.github/workflows/temporary-w04-manual-selector-placement.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate R syntax and W04 manual accordion selector
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(length(gregexpr('selectInput("w04_admin_manual_subset"',x,fixed=TRUE)[[1]])==1L)
          stopifnot(grepl('tags$strong(paste0(workflow_label, " · ", task_label))',x,fixed=TRUE))
          stopifnot(grepl('workflow_sections[visible_group_indices]',x,fixed=TRUE))
          stopifnot(grepl('Assignment batch: ',x,fixed=TRUE))
          cat("PASS single subset selector inside generic W04 manual screening accordion\n")
