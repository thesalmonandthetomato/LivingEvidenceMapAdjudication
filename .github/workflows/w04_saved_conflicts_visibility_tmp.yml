name: W04 saved model conflict visibility temporary
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Verify saved conflicts remain outside live rater result branch
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          lines <- readLines("multiuser_app/app.R",warn=FALSE)
          a <- grep("output\\$w04_consistency_history <- renderUI",lines)[1L]
          stopifnot(length(a)==1L,!is.na(a))
          marker <- grep("Saved comparisons and conflict adjudication",lines,fixed=TRUE)[1L]
          stopifnot(!is.na(marker))
          block <- paste(lines[(marker-7):(marker+8)],collapse="\n")
          stopifnot(grepl("uiOutput(\"w04_consistency_history\")",block,fixed=TRUE))
          stopifnot(grepl("uiOutput(\"w04_model_conflict_loader\")",block,fixed=TRUE))
          stopifnot(sum(grepl("uiOutput(\"w04_consistency_history\")",lines,fixed=TRUE))==1L)
          stopifnot(sum(grepl("uiOutput(\"w04_model_conflict_loader\")",lines,fixed=TRUE))==1L)
          stopifnot(grepl("Create conflict set",paste(lines,collapse=" "),fixed=TRUE))
          stopifnot(grepl("append_w04_conflict_set",paste(lines,collapse=" "),fixed=TRUE))
          cat("PASS: app parses, saved model analysis and conflict controls persist outside live stats. No API calls.\n")
