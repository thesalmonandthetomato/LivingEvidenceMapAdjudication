name: Temporary publication polling validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-publication-poll-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Verify syntax and polling scope
        shell: Rscript {0}
        run: |
          parse("multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          start <- regexpr("# Review-scoped publication receipts change only on workflow publication.",x,fixed=TRUE)[1]
          stopifnot(start > 0L)
          section <- substr(x,start,start+1200L)
          stopifnot(grepl("invalidateLater(180000,session)",section,fixed=TRUE))
          stopifnot(grepl("read_review_published_w01_w02(review,ss)",section,fixed=TRUE))
          stopifnot(grepl("invalidateLater(30000, session)",x,fixed=TRUE))
          cat("PASS: periodic publication reporting poll reduced; other task polling unchanged\n")
