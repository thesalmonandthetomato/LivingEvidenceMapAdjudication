name: W04 readable comparison labels temporary
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Check W04 saved-comparison label rendering
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          if(!requireNamespace("jsonlite",quietly=TRUE)) install.packages("jsonlite",quiet=TRUE)
          stopifnot(requireNamespace("jsonlite",quietly=TRUE))
          app <- readLines("multiuser_app/app.R",warn=FALSE)
          start <- grep("  w04_consistency_choice_label <- function",app,fixed=TRUE)
          stopifnot(length(start)==1L)
          end <- grep("  output\\$w04_consistency_history <- renderUI",app)[1L]
          stopifnot(!is.na(end),end>start)
          env <- new.env(parent=globalenv())
          env$`%||%` <- function(x,y)if(is.null(x)) y else x
          env$user_registry_rv <- function()list()
          env$find_user_by_id <- function(registry,id,require_active=FALSE)
            if(identical(id,"usr-matthew"))list(display_name="Matthew Grainger") else NULL
          env$normalise_user_row <- function(x)x
          eval(parse(text=paste(app[start:(end-1L)],collapse="\n")),env)
          a <- list(batch_id="w04-model-run-39046381271",
            rater_ids_json='["usr-matthew","model"]',
            conflict_n="12",created_at_utc="2026-10-17T16:37:04Z")
          label <- env$w04_consistency_choice_label(a)
          stopifnot(grepl("Model run 39046381271",label,fixed=TRUE),
            grepl("Matthew Grainger vs Model",label,fixed=TRUE),
            grepl("12 conflicts",label,fixed=TRUE),
            grepl("Saved 2026-10-17",label,fixed=TRUE),
            !grepl("w04-analysis-",label,fixed=TRUE))
          stopifnot(grepl("Human subset",env$w04_consistency_choice_label(
            list(batch_id="w04-human-test",rater_ids_json="[]",conflict_n="1")),fixed=TRUE))
          stopifnot(any(grepl("labels <- vapply(conflict_ready,w04_consistency_choice_label",app,fixed=TRUE)),
            any(grepl("selected=ids[[1L]]",app,fixed=TRUE)))
          cat("PASS: saved W04 comparison displays meaningful run, raters, date and conflicts.\n")
