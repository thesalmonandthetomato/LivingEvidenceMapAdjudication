name: Temporary W04 two-reviewer isolation validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-two-reviewer-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate batch and reviewer isolation
        shell: Rscript {0}
        run: |
          install.packages(c('digest','jsonlite'),repos='https://cloud.r-project.org')
          for(p in c('multiuser_app/app.R','multiuser_app/R/w04_subset_screening_adapter.R',
                     'multiuser_app/R/w04_subset_queue_storage.R',
                     'multiuser_app/R/w04_subset_queue_builder.R')) parse(file=p)
          source('multiuser_app/R/w04_subset_registry.R')
          source('multiuser_app/R/w04_subset_queue_builder.R')
          source('multiuser_app/R/w04_subset_screening_adapter.R')
          ids<-paste0('id-',seq_len(10));sha<-paste(rep('a',64),collapse='')
          corpus<-vapply(ids,function(id)as.character(jsonlite::toJSON(
            list(identity=list(record_id=id),canonical=list(title=id,abstract=paste('Study',id))),
            auto_unbox=TRUE)),character(1))
          a<-w04_subset_create('review-abc',ids,5,11,source_checkpoint_sha256=sha,created_by='admin')
          b<-w04_subset_create('review-abc',ids,5,22,source_checkpoint_sha256=sha,created_by='admin')
          qa<-w04_subset_screening_build(a,corpus,sha);qb<-w04_subset_screening_build(b,corpus,sha)
          stopifnot(qa$batch_id!=qb$batch_id,qa$queue_sha256!=qb$queue_sha256,
                    !any(vapply(qa$cases,function(z)z$review_case_id,character(1)) %in%
                         vapply(qb$cases,function(z)z$review_case_id,character(1))))
          decisions<-list(list(queue_sha256=qa$queue_sha256,review_case_id=qa$cases[[1]]$review_case_id,reviewer='human-one',decision='retain'),
                          list(queue_sha256=qa$queue_sha256,review_case_id=qa$cases[[1]]$review_case_id,reviewer='human-two',decision='exclude'),
                          list(queue_sha256=qb$queue_sha256,review_case_id=qb$cases[[1]]$review_case_id,reviewer='human-one',decision='retain'))
          events<-Filter(function(z)identical(z$queue_sha256,qa$queue_sha256),decisions)
          stopifnot(length(events)==2L,length(unique(vapply(events,function(z)z$reviewer,character(1))))==2L)
          app<-paste(readLines('multiuser_app/app.R',warn=FALSE),collapse='\n')
          stopifnot(grepl('subset_events <- w04_filter_batch_decisions(active_sheet_w04_decisions(),prepared$queue_sha256)',app,fixed=TRUE),
                    grepl('plan$subset_active_events <- subset_events',app,fixed=TRUE),
                    grepl('load_w04_batch(login_user)',app,fixed=TRUE))
          cat('PASS two-reviewer separation, subset checksum isolation, existing app wiring\n')
