name: Temporary W04 subset UI validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w04-subset-ui-validation.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Check UI and module syntax
        shell: Rscript {0}
        run: |
          for(p in c('multiuser_app/app.R','multiuser_app/R/w04_subset_registry.R',
                     'multiuser_app/R/w04_subset_storage.R'))
            parse(file=p)
          lines <- readLines('multiuser_app/app.R',warn=FALSE)
          stopifnot(any(grepl('w04_prompt_zenodo_link',lines,fixed=TRUE)),
                    any(grepl('w04_subset_registry_refresh',lines,fixed=TRUE)),
                    any(grepl('Load registered subsets',lines,fixed=TRUE)))
          cat('PASS W04 Zenodo draft link and read-only subset UI\n')
