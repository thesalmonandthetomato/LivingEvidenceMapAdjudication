name: Temporary Stage 2 history retry validation
on:
  push:
    paths:
      - '.github/workflows/temporary-stage2-history-retry.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Verify R parsing and retry flag
        shell: Rscript {0}
        run: |
          p <- "multiuser_app/app.R"
          parse(file=p)
          x <- paste(readLines(p,warn=FALSE),collapse="\n")
          a <- regexpr('w04_consistency_status(paste("Could not load saved W04 analysis history:"',x,fixed=TRUE)[1]
          stopifnot(a > 0L)
          failure <- substr(x,a,a+290L)
          stopifnot(!grepl("w04_consistency_history_loaded(TRUE)",failure,fixed=TRUE))
          stopifnot(grepl("w04_consistency_history_loaded(TRUE)",x,fixed=TRUE))
          cat("PASS: transient read failures permit retry\n")
