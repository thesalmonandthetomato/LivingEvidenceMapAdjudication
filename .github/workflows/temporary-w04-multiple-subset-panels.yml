name: Temporary W04 multiple subset panels
on:
  push:
    paths: ['.github/workflows/temporary-w04-multiple-subset-panels.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Validate W04 prepared-subset panel creation
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          lines <- readLines("multiuser_app/app.R",warn=FALSE)
          a <- grep("^[[:space:]]*add_empty_group <- function",lines)
          b <- grep('^[[:space:]]*add_empty_group\\(',lines)[1L]
          stopifnot(length(a)==1L,length(b)==1L,b>a)
          add <- parse(text=paste(lines[a:(b-1L)],collapse="\n"))[[1L]]
          env <- new.env(parent=baseenv())
          env$group_progress <- list("04|manual_screening|old"=list(
            assignments=list(list()),meta=list(workflow="04",task_type="manual_screening",batch_id="old"),
            progress=list(assigned=1L)))
          env$'%||%' <- function(x,y) if(is.null(x)) y else x
          eval(add,envir=env)
          env$add_empty_group("04","manual_screening","new", "independent_blind_review")
          stopifnot(length(env$group_progress)==2L)
          stopifnot("04|manual_screening|old" %in% names(env$group_progress))
          stopifnot("04|manual_screening|new" %in% names(env$group_progress))
          env$add_empty_group("04","manual_screening","new", "independent_blind_review")
          stopifnot(length(env$group_progress)==2L)
          src <- paste(lines,collapse="\n")
          stopifnot(grepl('if (has_w04_batch) {\n      add_empty_group(',src,fixed=TRUE))
          stopifnot(grepl('"04","manual_screening",w04_batch_id_rv()',src,fixed=TRUE))
          cat("PASS: active unassigned W04 subset is shown beside earlier batches without duplication\n")
