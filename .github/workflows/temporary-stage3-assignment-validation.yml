name: Temporary Stage 3 assignment validation
on:
  push:
    paths: ['.github/workflows/temporary-stage3-assignment-validation.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Test reviewer isolation and decision reload
        shell: Rscript {0}
        run: |
          source("multiuser_app/R/adjudication_schema.R")
          source("multiuser_app/R/users.R")
          source("multiuser_app/R/assignments.R")
          `%||%` <- function(x,y) if(is.null(x)) y else x
          user <- function(id) list(user_id=id,email=paste0(id,"@example.org"),display_name=id,role="reviewer",active=TRUE)
          a <- user("reviewer-a"); b <- user("reviewer-b")
          assignment <- function(id,uid,task) list(assignment_id=id,workflow="04",task_type=task,batch_id="synthetic",case_id="c1",user_id=uid,blind_group="test",status="assigned")
          cases <- list(list(case_id="c1",review_case_id="c1"),list(case_id="c2",review_case_id="c2"))
          blind <- list(assignment("a","reviewer-a","manual_screening"), assignment("b","reviewer-b","manual_screening"))
          stopifnot(identical(assignment_mode_for("04","manual_screening"),"independent_blind_review"))
          qa <- cases_for_assignment_user(cases,blind,"04","synthetic",a,"manual_screening")
          qb <- cases_for_assignment_user(cases,blind,"04","synthetic",b,"manual_screening")
          stopifnot(length(qa)==1L,length(qb)==1L)
          events <- list(list(case_id="c1",user_id="reviewer-a",decision="include",event_at_utc="2026-10-16T18:00:00Z"))
          stopifnot(length(cases_for_assignment_user(cases,blind,"04","synthetic",b,"manual_screening",events))==1L)
          shared <- list(assignment("c","reviewer-a","model_uncertainty"),assignment("d","reviewer-b","model_uncertainty"))
          stopifnot(identical(assignment_mode_for("04","model_uncertainty"),"shared_work_pool"))
          stopifnot(length(cases_for_assignment_user(cases,shared,"04","synthetic",b,"model_uncertainty",events))==0L)
          persisted <- tempfile()
          saveRDS(events,persisted)
          restored <- readRDS(persisted)
          stopifnot(identical(restored,events))
          stopifnot(length(cases_for_assignment_user(cases,blind,"04","synthetic",b,"manual_screening",restored))==1L)
          cat("PASS synthetic isolation, shared-pool resolution and decision reload\n")
