name: Temporary W04 retry and accordion regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w04-retry-accordion-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Parse R and exercise retry gate and accordion restoration
        shell: Rscript {0}
        run: |
          parse("multiuser_app/app.R")
          expressions <- parse("multiuser_app/R/w04_shiny_model_launch.R")
          `%||%` <- function(x,y) if (is.null(x)) y else x
          fn <- Filter(function(e) is.call(e) && identical(e[[1]],as.name("<-")) &&
            identical(e[[2]],as.name("w04_shiny_model_blocking_runs")),as.list(expressions))
          stopifnot(length(fn)==1L)
          eval(fn[[1]])
          label <- "W04 Shiny subset almeria-map w04-model-input-b5035344d31700e91e01.json"
          run <- function(id,conclusion,display_title=label) list(id=id,conclusion=conclusion,display_title=display_title)
          stopifnot(length(w04_shiny_model_blocking_runs(list(run(38913167294,"failure")),label))==0L)
          stopifnot(length(w04_shiny_model_blocking_runs(list(run(38913167294,"success")),label))==1L)
          stopifnot(length(w04_shiny_model_blocking_runs(list(run(38913167295,"failure")),label))==1L)
          stopifnot(length(w04_shiny_model_blocking_runs(list(run(38913167295,NULL)),label))==1L)
          stopifnot(length(w04_shiny_model_blocking_runs(list(run(38913167294,"failure","different")),label))==0L)
          stopifnot(length(w04_shiny_model_blocking_runs(list(run(38913167294,"failure"),run(38913167295,"in_progress")),label))==1L)
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          a <- regexpr("function restoreDetails(root)",x,fixed=TRUE)[1]
          b <- regexpr("document.addEventListener('DOMContentLoaded'",x,fixed=TRUE)[1]
          stopifnot(a>0,b>a)
          js <- substr(x,a,b-1)
          stopifnot(grepl("if (!el.dataset.lemBound) {",js,fixed=TRUE))
          stopifnot(grepl("const saved = sessionStorage.getItem(key)",js,fixed=TRUE))
          stopifnot(regexpr("if (!el.dataset.lemBound)",js,fixed=TRUE)[1] <
                    regexpr("const saved = sessionStorage.getItem(key)",js,fixed=TRUE)[1])
          cat("PASS: retry gate protects other attempts; accordion restores only newly mounted elements\n")
