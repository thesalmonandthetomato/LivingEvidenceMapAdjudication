name: Temporary W02 accordion check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w02-accordion-parse.yml']
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse and verify placement
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          s <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(grepl('configure-review-enrichment',s,fixed=TRUE),
                    grepl('configure-review-retractions',s,fixed=TRUE))
          cat("PASS: app parses and W02/W03 sections exist\n")
