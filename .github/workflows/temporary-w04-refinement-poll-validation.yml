name: Temporary W04 refinement status check
on:
  push:
    paths: ['.github/workflows/temporary-w04-refinement-poll-validation.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse and validate polling state and status classification
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          parse(file="multiuser_app/R/w04_prompt_refinement.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          for(term in c("invalidateLater(20000,session)","w04_refinement_poll_active_rv(TRUE)","w04_refinement_run_status(info)","w04_refinement_poll_active_rv(FALSE)","w04_refinement_run_link","w04_refinement_response_rv(outcome$proposed)"))
            stopifnot(grepl(term,x,fixed=TRUE))
          y <- paste(readLines("multiuser_app/R/w04_prompt_refinement.R",warn=FALSE),collapse="\n")
          stopifnot(grepl('identical(as.character(x$display_title',y,fixed=TRUE))
          stopifnot(grepl('if(identical(conclusion,"success")) "completed" else "failed"',y,fixed=TRUE))
          cat("PASS refinement status polling code\n")
