name: Temporary W04 model return UI validation
on:
  push:
    paths: ['.github/workflows/temporary-w04-model-return-ui-validation.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Validate Shiny model comparison
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          parse(file="multiuser_app/R/w04_model_batches.R")
          lines <- readLines("multiuser_app/R/w04_model_batches.R",warn=FALSE)
          app <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          env <- new.env(parent=baseenv())
          env[["%||%"]] <- function(x,y) if(is.null(x)) y else x
          env[["setNames"]] <- stats::setNames
          a <- grep("^w04_model_batch_comparison <- function",lines)
          stopifnot(length(a)==1L)
          eval(parse(text=paste(lines[a:length(lines)],collapse="\n")),envir=env)
          model <- data.frame(record_id=c("r1","r2","r3"),decision=c("retain","exclude","uncertain"))
          human <- list(
            list(record_id="r1",review_case_id="subset-1|r1",reviewer="usr-matthew",decision="retain"),
            list(record_id="r2",review_case_id="subset-1|r2",reviewer="usr-matthew",decision="exclude"),
            list(record_id="r3",review_case_id="other-subset|r3",reviewer="usr-matthew",decision="retain"))
          out <- env$w04_model_batch_comparison(model,human,"subset-1")
          stopifnot(nrow(out)==3L,"usr-matthew"%in%names(out),
            identical(out[["usr-matthew"]][1:2],c("retain","exclude")),
            is.na(out[["usr-matthew"]][3]))
          checks <- c("w04_model_batch_registry_read(meta$review_id)",
            "w04_model_batch_results_read(batch)",
            "read_sheet_w04_resolution_queue(as.character(batch$resolution_tab))",
            "w04_model_batch_comparison(rows,human,as.character(batch$subset_id))",
            "w04_reviewer_model_batches_rv","w04_reviewer_model_batch_open")
          stopifnot(all(vapply(checks,function(x)grepl(x,app,fixed=TRUE),logical(1))))
          cat("PASS: Shiny batch controls and subset-scoped comparisons\n")
