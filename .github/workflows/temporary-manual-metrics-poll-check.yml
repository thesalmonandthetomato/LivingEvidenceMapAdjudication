name: Temporary manual metrics poll check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-manual-metrics-poll-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Validate R and first-tick guard
        shell: Rscript {0}
        run: |
          parse("multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(grepl("manual_metrics_poll_armed <- reactiveVal(FALSE)",x,fixed=TRUE))
          stopifnot(grepl("isolate(manual_metrics_poll_armed())",x,fixed=TRUE))
          stopifnot(grepl("manual_metrics_poll_armed(TRUE)\n      return()",x,fixed=TRUE))
          stopifnot(grepl("invalidateLater(300000, session)",x,fixed=TRUE))
          stopifnot(grepl('manual_screening_rv(login_timed_read("manual screening metrics",read_manual_screening_metrics))',x,fixed=TRUE))
          cat("PASS: no immediate duplicate metrics fetch, periodic refresh retained\n")
