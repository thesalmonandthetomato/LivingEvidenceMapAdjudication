name: Temporary W04 overview regression
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Check source and regression joins
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          if(!requireNamespace("jsonlite",quietly=TRUE)) install.packages("jsonlite",quiet=TRUE)
          `%||%` <- function(x,y)if(is.null(x))y else x
          source("multiuser_app/R/w04_workspace_overview.R")
          subset <- list(subset_id="w04-subset-a",label="Check 1",
            actual_size="2",created_at_utc="2026-10-14T10:00:00Z")
          prompt <- list(version_id="w04-version-a",notes="Validation prompt",
            created_at_utc="2026-10-15T10:00:00Z",author="usr-neal")
          run <- list(run_id="39046381271",subset_id="w04-subset-a",
            prompt_version_id="w04-version-a",published_at_utc="2026-10-17T10:00:00Z",
            total="2",uncertain="0")
          analysis <- list(analysis_id="a1",batch_id="w04-model-run-39046381271",
            created_at_utc="2026-10-17T11:00:00Z",
            rater_ids_json='["usr-matthew","model"]',raw_agreement="0.5",conflict_n="1")
          set <- list(analysis_id="a1",conflict_queue_sha256="sha")
          assign <- list(workflow="04",task_type="manual_screening",
            batch_id="w04-human-w04-subset-a",user_id="usr-matthew",status="active")
          decision <- list(review_case_id="w04-subset-a|r1",reviewer="usr-matthew",decision="retain")
          conflict_decision <- list(queue_sha256="sha",review_case_id="r1")
          users <- list(list(user_id="usr-matthew",display_name="Matthew Grainger"),
            list(user_id="usr-neal",display_name="Administrator"))
          out <- w04_overview_build(list(subset),list(prompt),list(run),list(analysis),
            list(set),list(assign),list(decision),list(conflict_decision),users)
          stopifnot(nrow(out$subsets)==1L,nrow(out$prompts)==1L,nrow(out$runs)==1L,
            nrow(out$comparisons)==1L,
            out$subsets$Model_runs[[1L]]==1L,
            grepl("Matthew Grainger",out$subsets$Reviewers[[1L]],fixed=TRUE),
            grepl("1",out$subsets$Screened[[1L]],fixed=TRUE),
            out$comparisons$Adjudicated[[1L]]==1L)
          stopifnot(nrow(w04_overview_build(list(),list(),list(),list(),list(),
            list(),list(),list(),list())$runs)==0L)
          cat("PASS: parse, source, review linkages, progress, empty registries. No external API calls.\n")
