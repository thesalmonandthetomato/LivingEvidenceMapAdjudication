name: Temporary Configure scope isolation validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-configure-scope-isolation.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Validate R and scoped outputs
        shell: Rscript {0}
        run: |
          parse("multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          start <- regexpr("output$configure_review_contents <- renderUI({",x,fixed=TRUE)[1]
          end <- regexpr("observeEvent(input$configure_searching_opened,",x,fixed=TRUE)[1]
          stopifnot(start>0,end>start)
          body <- substr(x,start,end-1)
          stopifnot(!grepl("search_scope_status_rv()",body,fixed=TRUE))
          stopifnot(!grepl("search_scope_versions_rv()",body,fixed=TRUE))
          stopifnot(grepl('uiOutput("configure_scope_versions")',body,fixed=TRUE))
          stopifnot(grepl('textOutput("configure_scope_status", inline=TRUE)',body,fixed=TRUE))
          stopifnot(grepl('output$configure_scope_status <- renderText',x,fixed=TRUE))
          stopifnot(grepl('output$configure_scope_versions <- renderUI',x,fixed=TRUE))
          for (id in c("w04_prompt_text","w04_model_launch","w04_highlight_include","w04_subset_size"))
            stopifnot(grepl(paste0('"',id,'"'),body,fixed=TRUE))
          cat("PASS: R parse; changing scope status/versions does not invalidate main Configure review tree\n")
