name: Temporary Stage 2 conflict snapshot validation
on:
  push:
    paths:
      - '.github/workflows/temporary-stage2-conflict-snapshot.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse and check conflict snapshot contract
        shell: Rscript {0}
        run: |
          p <- "multiuser_app/app.R"
          parse(file=p)
          x <- paste(readLines(p,warn=FALSE),collapse="\n")
          stopifnot(grepl("identical(active_sha, as.character(isolate(w04_conflict_queue_sha_rv())",x,fixed=TRUE))
          stopifnot(grepl("set_decisions <- isolate(w04_conflict_decisions())",x,fixed=TRUE))
          stopifnot(grepl("active_sheet_w04_conflict_decisions()",x,fixed=TRUE))
          cat("PASS: R parse and conflict decision snapshot fallback\n")
