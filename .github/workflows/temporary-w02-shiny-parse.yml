name: Temporary W02 Shiny syntax check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-w02-shiny-parse.yml'
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse W02 app and storage integration
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          parse(file="multiuser_app/R/storage_sheets.R")
          parse(file="multiuser_app/R/github_dispatch.R")
          cat("PASS: W02 Shiny R integration parses\n")
