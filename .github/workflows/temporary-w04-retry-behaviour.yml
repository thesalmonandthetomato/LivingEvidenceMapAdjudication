name: Temporary W04 retry behaviour
on:
  push:
    paths: ['.github/workflows/temporary-w04-retry-behaviour.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Verify recovery after accepted append and failed verification
        shell: Rscript {0}
        run: |
          install.packages("digest",repos="https://cloud.r-project.org",quiet=TRUE)
          lines <- readLines("multiuser_app/R/storage_sheets.R",warn=FALSE)
          a <- grep("^append_w04_decision_to_tab <- function",lines)
          b <- grep("^append_sheet_w04_decision <- function",lines)
          stopifnot(length(a)==1L,length(b)==1L,b>a)
          src <- paste(lines[a:(b-1L)],collapse="\n")
          # Replace only API-qualified calls in the in-memory test copy.
          src <- gsub("googlesheets4::sheet_append","mock_append",src,fixed=TRUE)
          src <- gsub("googlesheets4::read_sheet","mock_read",src,fixed=TRUE)
          src <- gsub("googlesheets4::cell_cols","mock_cols",src,fixed=TRUE)
          env <- new.env(parent=baseenv())
          env$'%||%' <- function(x,y) if(is.null(x)) y else x
          env$gs4_auth_from_env <- function() invisible(NULL)
          env$sheet_id_from_env <- function() "synthetic-sheet"
          env$sheet_names_cached <- function(ss) "synthetic-tab"
          env$mock_cols <- function(x) x
          events <- character()
          attempts <- 0L
          reads <- 0L
          fail_verification <- TRUE
          env$mock_append <- function(ss,data,sheet) {
            attempts <<- attempts+1L
            events <<- c(events,as.character(data$decision_id[[1L]]))
            invisible(NULL)
          }
          env$mock_read <- function(ss,sheet,range,col_types) {
            reads <<- reads+1L
            if(isTRUE(fail_verification)) stop("synthetic quota error on verification")
            data.frame(decision_id=events,stringsAsFactors=FALSE)
          }
          env$normalise_saved_decision_event <- function(event,prior_decision,case_fields) event
          eval(parse(text=src),envir=env)
          d <- list(review_case_id="c1",record_id="r1",decision="include",
            rationale="synthetic",reviewer="reviewer-a",
            resolved_at_utc="2026-10-16T19:30:00Z",queue_sha256="sha1")
          first <- tryCatch(env$append_w04_decision_to_tab(d,tab="synthetic-tab"),error=identity)
          stopifnot(inherits(first,"error"),attempts==1L,length(events)==1L)
          fail_verification <- FALSE
          second <- env$append_w04_decision_to_tab(d,tab="synthetic-tab",recover_existing=TRUE)
          stopifnot(attempts==1L,length(events)==1L,reads==2L,
                    identical(as.character(second$decision_id),events[[1L]]))
          third <- tryCatch(env$append_w04_decision_to_tab(d,tab="synthetic-tab",recover_existing=FALSE),error=identity)
          stopifnot(inherits(third,"error"),attempts==2L)
          cat("PASS: retry recovers accepted append without a duplicate\n")
