name: Temporary W04 comparison controls validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_w04_auto_compare.yml']
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {r-version: '4.4.3', use-public-rspm: true}
      - name: Parse R and validate comparison selectors
        shell: Rscript {0}
        run: |
          invisible(parse("multiuser_app/app.R"))
          invisible(parse("multiuser_app/R/storage_sheets.R"))
          a <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(grepl("w04_comparison_load_subset <- function(id)",a,fixed=TRUE))
          stopifnot(grepl("w04_comparison_load_model <- function(id)",a,fixed=TRUE))
          stopifnot(!grepl('actionButton("w04_consistency_subset_load"',a,fixed=TRUE))
          stopifnot(!grepl('actionButton("w04_consistency_find_models"',a,fixed=TRUE))
          stopifnot(!grepl('actionButton("w04_consistency_load_model"',a,fixed=TRUE))
          cat("PASS: parsed app and confirmed comparison selections trigger loads\n")
