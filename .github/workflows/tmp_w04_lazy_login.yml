name: Temporary deferred W04 validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_w04_lazy_login.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Parse app and test deferred W04 contract
        shell: Rscript {0}
        run: |
          p <- "multiuser_app/app.R"
          invisible(parse(file=p))
          s <- paste(readLines(p,warn=FALSE),collapse="\n")
          stopifnot(grepl('w04_queued_init_rv(function() {',s,fixed=TRUE))
          stopifnot(grepl('observeEvent(input$load_w04_on_demand',s,fixed=TRUE))
          stopifnot(grepl('if(!isTRUE(w04_queue_loaded_rv()))',s,fixed=TRUE))
          stopifnot(grepl('session$onFlushed(load_workflow_queues,once=TRUE)',s,fixed=TRUE))
          cat("PASS: multiuser R parses; W04 loading is deferred and dashboard action exists\n")
