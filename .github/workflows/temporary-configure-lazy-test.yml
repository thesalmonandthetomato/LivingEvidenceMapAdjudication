name: Temporary configure-review lazy rendering regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-configure-lazy-test.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse Shiny and verify deferred configuration
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          stopifnot(grepl("configure_review_requested <- reactiveVal(FALSE)",x,fixed=TRUE))
          stopifnot(grepl('actionButton("open_configure_review","Configure review"',x,fixed=TRUE))
          stopifnot(grepl("if(!isTRUE(configure_review_requested())) return(",x,fixed=TRUE))
          stopifnot(grepl("req(authenticated(),configure_review_requested())",x,fixed=TRUE))
          stopifnot(grepl("if(!isTRUE(authenticated())) configure_review_requested(FALSE)",x,fixed=TRUE))
          stopifnot(grepl('data-accordion-key`="configure-review"',x,fixed=TRUE))
          cat("PASS configuration load is explicitly requested; syntax valid\n")
