name: Temporary Stage 3 decision pathways
on:
  push:
    paths: ['.github/workflows/temporary-stage3-decision-paths.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Check W01 W02 W08 fail-safe decision ordering
        shell: Rscript {0}
        run: |
          f <- "multiuser_app/app.R"
          parse(file=f)
          s <- paste(readLines(f,warn=FALSE),collapse="\n")
          section <- function(first,last) {
            a <- regexpr(first,s,fixed=TRUE)[1L]
            stopifnot(a>0L)
            tail <- substr(s,a,nchar(s))
            b <- regexpr(last,tail,fixed=TRUE)[1L]
            stopifnot(b>1L)
            substr(tail,1L,b-1L)
          }
          verify <- function(x,persist,guard,mutation,error) {
            a <- regexpr(persist,x,fixed=TRUE)[1L]
            b <- regexpr(guard,x,fixed=TRUE)[1L]
            c <- regexpr(mutation,x,fixed=TRUE)[1L]
            stopifnot(a>0L,b>a,c>b,grepl(error,x,fixed=TRUE))
          }
          w01 <- section("save_choice <- function(choice) {","advance_after_save <- function")
          w02 <- section("save_w02_choice <- function(choice) {","observeEvent(input$w01_mark_resolved")
          w08 <- section("save_w08_record <- function() {","dispatch_completed_w08 <- function")
          verify(w01,"save_active_decision(decision, decision_path","if (is.null(saved)) return(FALSE)","decisions(c(remaining, list(saved)))","Save failed:")
          verify(w02,"append_sheet_w02_decision(decision, prior_decision=prior)","if (is.null(saved)) return(FALSE)","w02_decisions(c(remaining,list(saved)))","Save failed:")
          verify(w08,"append_sheet_w08_decision(decision,prior_decision=prior)","if(is.null(saved)) return(FALSE)","w08_decisions(c(remaining,list(saved)))","Save failed:")
          cat("PASS: W01 W02 W08 fail before state mutation; save success after persistence\n")
