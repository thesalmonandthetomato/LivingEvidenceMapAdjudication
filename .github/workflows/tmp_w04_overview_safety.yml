name: Temporary W04 overview safety validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_w04_overview_safety.yml'
      - 'multiuser_app/app.R'
      - 'multiuser_app/R/w04_work_overview_sheets.R'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Parse changed R code and verify safeguards
        shell: Rscript {0}
        run: |
          p <- "multiuser_app/app.R"
          h <- "multiuser_app/R/w04_work_overview_sheets.R"
          invisible(parse(file=p))
          invisible(parse(file=h))
          app <- paste(readLines(p,warn=FALSE),collapse="\n")
          helper <- paste(readLines(h,warn=FALSE),collapse="\n")
          stopifnot(grepl("w04_summary_read(review_id=w04_prompt_review_metadata()$review_id,create_if_missing=FALSE)",app,fixed=TRUE))
          stopifnot(grepl('if(!create_if_missing)stop("W04 overview summary tab is missing; run historical import first.",call.=FALSE)',helper,fixed=TRUE))
          stopifnot(grepl("rows <- rows[!is.na(rows$review_id)&as.character(rows$review_id)==review_id",helper,fixed=TRUE))
          cat("PASS: multiuser application parses, W04 reader parses, refresh is review-scoped, and missing tab is an explicit error\n")
