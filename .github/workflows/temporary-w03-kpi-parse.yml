name: Temporary W03 KPI parse
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-w03-kpi-parse.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse R files
        shell: Rscript {0}
        run: |
          parse(file='multiuser_app/R/github_dispatch.R')
          parse(file='multiuser_app/app.R')
          cat('PASS: W03 syntax\n')
