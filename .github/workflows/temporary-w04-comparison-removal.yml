name: Temporary W04 comparison UI removal validation
on:
  push:
    paths: ['.github/workflows/temporary-w04-comparison-removal.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse and verify κ pathway preserved
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          x <- paste(readLines("multiuser_app/app.R",warn=FALSE),collapse="\n")
          for(term in c("w04_model_batch_compare","w04_model_comparison_summary","w04_model_comparison_table"))
            stopifnot(!grepl(term,x,fixed=TRUE))
          stopifnot(grepl("w04_model_batch_open",x,fixed=TRUE))
          stopifnot(grepl("w04_kappa",x,fixed=TRUE))
          cat("PASS comparison UI removed; model batch and kappa controls retained\n")
