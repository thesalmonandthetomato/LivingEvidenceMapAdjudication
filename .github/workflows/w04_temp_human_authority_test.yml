name: Temporary W04 human authority regression
on:
  push:
    paths:
      - .github/workflows/w04_temp_human_authority_test.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Check authoritative human disagreement and unresolved exclusions
        shell: Rscript {0}
        run: |
          `%||%` <- function(x,y)if(is.null(x)||!length(x))y else x
          w04_subset_record_ids <- function(x)sort(unique(as.character(x)))
          source("multiuser_app/R/w04_model_batches.R")
          batch <- list(list(run_id="101",subset_id="set-a",uncertain=0L))
          results <- function(b)data.frame(record_id="rec-1",decision="exclude")
          human <- list(list(record_id="rec-1",status="single_human",final_decision="retain"))
          z <- w04_screening_coverage_reconcile("rec-1",batch,human,
                                                read_results=results)
          stopifnot(z$ready,z$resolved==1L,z$records[[1]]$status=="resolved",
                    z$records[[1]]$decision=="retain",
                    isTRUE(z$records[[1]]$human_model_disagreement))
          cat("PASS verified human authority over disagreeing model\n")
          pending <- list(list(record_id="rec-1",status="pending",final_decision=""))
          b <- w04_screening_coverage_reconcile("rec-1",batch,pending,
                                                read_results=results)
          stopifnot(!b$ready)
          cat("PASS incomplete human review still blocks finalisation\n")
          human2 <- c(human,list(list(record_id="rec-1",status="single_human",
                                    final_decision="exclude")))
          c <- w04_screening_coverage_reconcile("rec-1",batch,human2,
                                                read_results=results)
          stopifnot(!c$ready)
          cat("PASS conflicting human decisions still block finalisation\n")
          parse(file="multiuser_app/app.R")
          cat("PASS Shiny parse\n")
