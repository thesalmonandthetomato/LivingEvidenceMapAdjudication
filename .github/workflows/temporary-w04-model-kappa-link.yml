name: Temporary W04 model kappa integration
on:
  push:
    paths: ['.github/workflows/temporary-w04-model-kappa-link.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Validate R syntax and run-scoped uncertainty handling
        shell: Rscript {0}
        run: |
          parse(file="multiuser_app/app.R")
          source("multiuser_app/R/w04_model_batches.R",local=TRUE)
          `%||%` <- function(x,y) if(is.null(x))y else x
          z <- list(list(record_id="a",case=list(),reviewer_decisions=list()),list(record_id="b",case=list(),reviewer_decisions=list()))
          m <- data.frame(record_id=c("a","b"),decision=c("retain","uncertain"))
          unresolved <- w04_model_consistency_outcomes(z,m)
          stopifnot(identical(unresolved[[2]]$case$model_decision,"uncertain"))
          resolved <- w04_model_consistency_outcomes(z,m,list(list(record_id="b",decision="exclude")))
          stopifnot(identical(resolved[[2]]$case$model_decision,"exclude"))
          bad <- tryCatch(w04_model_consistency_outcomes(z,m,list(list(record_id="a",decision="exclude"))),error=identity)
          stopifnot(inherits(bad,"error"))
          wrong <- tryCatch(w04_model_consistency_outcomes(z,data.frame(record_id=c("a","c"),decision=c("retain","exclude"))),error=identity)
          stopifnot(inherits(wrong,"error"))
          cat("PASS: W04 model kappa data isolation and app parse\n")
